# How each adapter in the catalogue was measured, as its page shows it under "How it was measured" (owner-approved
# numbers, 4 November 2026; every figure is from the approved table of evaluation numbers, none computed here).
#   base, date: the base model and the day the adapter in use was trained (null: not recorded).
#   tests: accuracy (% of test rows whose top answer was right), rows (null: not recorded), kind (public: a public
#     benchmark; real: held-out real documents; generator: an in-house test from the same generator as the training
#     data; mixed: several kinds of source; unknown: not recorded), set (what the rows are). A public or real set, where
#     there is one, comes first. no_accuracy instead says why there is no figure.
#   confident: per function, from the manifest's calibration: precision (share right when confident), coverage (share
#     confident), threshold (the confidence from which it counts as confident), rows (calibration rows).
#     no_calibration instead says why there is none.
#   caveats: one line each, from the data notes.
# The hub test test/adapter-numbers.test.ts fails if a listed adapter has no entry, an entry names an adapter the
# catalogue does not list, or a calibration figure differs from the adapter's manifest.

