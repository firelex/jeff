    - option: payments
      probability: 0.0
    server: v1.4
    at: '2026-11-03'
- id: oss-support-intents
  name: Cancel boots before they ship
  function: jeff.support.support-intents.intent
  context:
    service: Customer support chat of an online shop
  input: hi, i changed my mind about the boots i ordered yesterday, can i still stop the order before it ships?
  labels:
    cancel_order: Cancel an order that has not been delivered yet
    track_order: Find out where an order is
    change_address: Change the delivery address of an order
    return_item: Return an item that was delivered
    track_refund: Find out the status of a refund
  recorded:
    value: cancel_order
    confidence: 0.999
    top_options:
    - option: cancel_order
      probability: 0.999
    - option: return_item
      probability: 0.0
    - option: track_order
      probability: 0.0
    server: v1.4
    at: '2026-11-03'
- id: oss-trading-desk
  name: Losing long position below its average
  function: jeff.finance.trading-desk.risk_off
  context:
    desk: |-
      Strategy: mean reversion on one stock. Buy when the mid is more than 0.6% below its 20-minute average, sell when more than 0.6% above.
      Clip size: 500 shares. Position limit: 3,000 shares either way.
      Filters: no new trades when the spread is wider than 8 basis points, or after 15:45.
      Risk-off triggers: (1) the day's loss on this stock exceeds 25,000; (2) realised volatility over 5 minutes is above 60% annualised; (3) a trading halt or a news alert flagged "material" on this stock.
      Venues: venue_a (lit exchange, fee 0.3 bp, 0.4 ms), venue_b (lit exchange, rebate 0.1 bp, 1.1 ms), venue_c (dark pool, fee 0.1 bp, 2.0 ms).
    market_context: 'Stock: a mid-cap European industrial. Date: 2 November 2026. Opening mid 41.20; morning range 40.95 to 41.60; typical spread 4 bp; trading normal.'
  input: |-
    Time 13:12:05. Mid 40.31, 20-minute average 40.88. Spread 5 bp.
    Order-flow imbalance -0.42. Realised volatility (5 min) 38% annualised.
    Position: long 2,500 shares, average price 41.35. Day P&L on this stock: -26,400.
    Open orders: none. News: none flagged.
  recorded:
    value: 'yes'
    confidence: 1.0
    top_options:
    - option: 'yes'
      probability: 1.0
    - option: 'no'
      probability: 0.0
    server: v1.4
    at: '2026-11-03'
