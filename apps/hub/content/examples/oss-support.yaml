# The "Support" page's examples (guides/oss-support.md): sorting incoming messages, deciding who acts, and a trading
# desk's rule check. Format and recording: scripts/hub_examples.py. The `recorded` blocks are written by
# `scripts/hub_examples.py --record`, never by hand. Every input here was written for the page.
- id: oss-message-triage
  name: Supplier invoice to the office manager
  function: jeff.support.message-triage.action_needed
  context:
    recipient:
      name: Lena Brandt
      address: lena.brandt@hollowayarch.example
      role: Office manager
      organisation: Holloway Architects
    message_kinds:
      invoice: A supplier's bill or a question about one
      booking: Meeting room, travel or event bookings
      it_problem: Something broken with computers, phones or the network
      newsletter: Bulk mail and marketing
    routing_table:
    - key: finance
      name: Finance team
      address: finance@hollowayarch.example
      topics: Supplier invoices, payments, expenses
    - key: it
      name: IT support
      address: it@hollowayarch.example
      topics: Computers, phones, printers, network and accounts
    routing_rules:
    - Anything about a client project's fees goes to the partner on the project, never to finance.
    now: Monday 2 November 2026, 09:40
  input:
    channel: email
    from: billing@greenleafplants.example
    to: lena.brandt@hollowayarch.example
    cc: ''
    received: Monday 2 November 2026, 08:55
    subject: Invoice GL-5520 for October plant care
    body: Hello Lena, please find attached our invoice GL-5520 for October's plant care at your Bristol office, 240.00. Could you arrange payment within 30 days? Kind regards, Greenleaf Plants
  recorded:
    value: forward
    confidence: 0.99
    top_options:
    - option: forward
      probability: 0.99
    - option: do_task
      probability: 0.007
    - option: fyi_only
      probability: 0.001
    server: v1.4
    at: '2026-11-03'
- id: oss-requires-action
  name: Pothole reported to the council
  function: jeff.support.requires-action.requires_action
  context:
    team:
      organisation: Westmoor Borough Council
      name: Highways team
    policy:
    - The team handles potholes, damaged road signs, blocked drains on roads and broken street lights.
    - Any report of an immediate danger to people (for example an exposed cable or a collapsed road) must be escalated to the duty officer.
    - Bin collections and parking fines belong to other teams.
  input:
    from: r.osei@mailbox.example
    to: highways@westmoor.example
    date: 2 November 2026
    subject: Pothole on Mill Lane
    body: There's a deep pothole outside number 14 Mill Lane, right where cyclists come down the hill. Could someone take a look?
  recorded:
    value: 'yes'
    confidence: 0.991
    top_options:
    - option: 'yes'
      probability: 0.991
    - option: unclear
      probability: 0.006
    - option: 'no'
      probability: 0.003
    server: v1.4
    at: '2026-11-03'
