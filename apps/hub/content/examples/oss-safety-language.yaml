- id: oss-soc
  name: Mass file renaming on a laptop
  function: jeff.security.soc.action
  context:
    organisation: A regional logistics company; this queue handles alerts from the laptops' endpoint protection.
    playbook: |-
      1. Ransomware behaviour (many files renamed or encrypted quickly) on any laptop: isolate the laptop.
      2. A known malicious outside address contacted: block the address.
      3. A login from a new country for an administrator: escalate.
      4. Anything else that fired: investigate.
      Allowed actions: block, isolate, escalate, investigate, ignore.
  input: |-
    Alert: suspicious file activity on laptop LT-0441 (user: warehouse planner).
    In 90 seconds, 2,314 files in the user's documents folder were renamed with the extension .locked.
    Process: an unsigned program started from the downloads folder.
  recorded:
    value: isolate
    confidence: 0.795
    top_options:
    - option: isolate
      probability: 0.795
    - option: investigate
      probability: 0.202
    - option: escalate
      probability: 0.002
    server: v1.4
    at: '2026-11-03'
