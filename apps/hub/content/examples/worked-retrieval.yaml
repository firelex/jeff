# The "A retrieval pipeline that knows when not to answer" worked example (guides/worked-retrieval.md): an e-bike
# maker's help assistant routes a question to a source, keeps the passages that bear on it, checks they are enough to
# answer (or says it does not know), and checks the answer against them. Format and recording: scripts/hub_examples.py.
# The `recorded` blocks are written by `scripts/hub_examples.py --record-new`, never by hand. Every input here was
# written for the page.
- id: worked-retrieval-route
  name: A warranty question, which source
  function: jeff.retrieval.query-route.source
  context:
    menu: |-
      - product_manuals: user and repair manuals for every Kestrel e-bike
      - warranty_terms: the warranty terms for each model, by model and purchase date
      - customer_orders: each customer's orders, deliveries and repairs (a database)
      - pricing: current prices, spare parts and offers
  input: Does the warranty on my Kestrel Volt 2 still cover the battery after two years?
  labels:
    product_manuals: User and repair manuals for every Kestrel e-bike
    warranty_terms: The warranty terms for each model, by model and purchase date
    customer_orders: Each customer's orders, deliveries and repairs (a database)
    pricing: Current prices, spare parts and offers
    none: No source on the menu holds what the query needs, or no lookup is needed
    several: The answer needs facts from two or more of these sources
  recorded:
    value: warranty_terms
    confidence: 0.975
    top_options:
    - option: warranty_terms
      probability: 0.975
    - option: none
      probability: 0.008
    - option: customer_orders
      probability: 0.008
    server: v1.4
    at: '2026-11-04'
