# More worked examples for the retrieval and document adapters' catalogue pages (/catalogue/<adapter id>): with each
# adapter's examples on the "Retrieval" page (oss-retrieval.yaml), the swarm page (swarm.yaml) and its catalogue example
# (catalogue-open.yaml), five cases per adapter, each with a different outcome where the adapter has several.
# content/catalogue-examples.yaml says which page shows which and what each one shows. Format and recording:
# scripts/hub_examples.py. The `recorded` blocks are written by `scripts/hub_examples.py --record`, never by hand.
# Every input here was written for the page; every company and person in it is invented.
- id: more-doc-type-invoice
