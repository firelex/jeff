# The "Agents" page's examples (guides/oss-agents.md): one agent turn followed through, from choosing a tool to
# checking that the task is done, then the tool router. Format and recording:
# scripts/hub_examples.py. The `recorded` blocks are written by `scripts/hub_examples.py --record`, never by hand.
# Every input here was written for the page.
- id: oss-tool-route
  name: Send the invoice and copy me
  function: jeff.agents.tool-route.tool
  context:
    app: Pinecrest Books, a bookkeeping assistant for a small design studio. It keeps the studio's invoices and clients and emails invoices on request.
    today: Monday 2 November 2026
    tools: |-
      def find_invoice(client: str, month: str) -> dict:
          """Finds the studio's invoice for a client and month."""
      def send_invoice(invoice_id: str, to: str, cc: list[str] = []) -> dict:
          """Emails an invoice to a recipient, with optional copies."""
      def create_invoice(client: str, items: list[dict]) -> dict:
          """Creates a new draft invoice."""
    conversation:
    - role: user
      content: Morning! Can you send the October invoice for Orbit Print?
    - role: assistant
      content: I found it, INV-2026-0412 for 2,350.00, still unpaid. Who at Orbit Print should receive it?
  input: Send it to their accounts address, accounts@orbitprint.example, and copy me.
  labels:
    find_invoice: Finds the studio's invoice for a client and month.
    send_invoice: Emails an invoice to a recipient, with optional copies.
    create_invoice: Creates a new draft invoice.
    none: No tool is needed, or no tool on the menu can do what the user asks.
    ask_user: A tool fits, but a required detail is missing and the agent must ask the user.
  recorded:
    value: send_invoice
    confidence: 0.998
    top_options:
    - option: send_invoice
      probability: 0.998
    - option: ask_user
      probability: 0.002
    - option: find_invoice
      probability: 0.0
    server: v1.4
    at: '2026-11-03'
- id: oss-action-check
