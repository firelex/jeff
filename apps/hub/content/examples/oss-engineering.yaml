- id: oss-issue-route-owner
  name: 'Crash on missing timestamps: who owns it'
  function: jeff.engineering.issue-route.owner
  context:
    project: |-
      tidepool is an open-source Python library for reading and writing tide-gauge data files. Components:
      - readers (team io): file readers for CSV, NetCDF and the station formats; paths tidepool/readers/
      - plotting (team viz): charts and maps; paths tidepool/plot/
      - cli (team tools): the tidepool command; paths tidepool/cli/
      - docs (team docs): the documentation site; paths docs/
    open_issues:
    - '#398 [plotting] Map legend overlaps the colour bar'
    - '#405 [cli] Add a --quiet flag'
  input:
    type: issue
    number: 417
    title: tidepool plot crashes on a NetCDF file with missing timestamps
    body: >-
      Running `tidepool plot station.nc` stops with "KeyError: 'time'" in tidepool/readers/netcdf.py line 88, before
      any chart appears. The same file opens fine in other tools.
    labels: []
  labels:
    readers: File readers for CSV, NetCDF and the station formats (tidepool/readers/)
    plotting: Charts and maps (tidepool/plot/)
    cli: The tidepool command (tidepool/cli/)
    docs: The documentation site (docs/)
