- id: more-soc-block
  name: Laptop calling a known bad address
  function: jeff.security.soc.action
  context:
    organisation: &soc_org A regional logistics company; this queue handles alerts from the laptops' endpoint protection.
    playbook: &soc_playbook |-
      1. Ransomware behaviour (many files renamed or encrypted quickly) on any laptop: isolate the laptop.
      2. A known malicious outside address contacted: block the address.
      3. A login from a new country for an administrator: escalate.
      4. The IT team's weekly test alert (named "Weekly AV check"): ignore.
      5. Anything else that fired: investigate.
      Allowed actions: block, isolate, escalate, investigate, ignore.
  input: |-
    Alert: outbound connection to a known malicious address from laptop LT-0517 (user: driver scheduler).
    Destination 198.51.100.77, listed on the threat feed as a command-and-control server since 30 October.
    No unusual file activity on the laptop.
  recorded:
    value: block
    confidence: 1.0
    top_options:
    - option: block
      probability: 1.0
    - option: isolate
      probability: 0.0
    - option: escalate
      probability: 0.0
    server: v1.4
    at: '2026-11-04'
