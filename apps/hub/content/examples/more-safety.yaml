# More worked examples for the safety, language and security adapters' catalogue pages (/catalogue/<adapter id>): with
# each adapter's examples on the "Safety and language" page (oss-safety-language.yaml), the home page (start.yaml) and the
# catalogue (catalogue-open.yaml), five cases per adapter, each with a different outcome where
# the adapter has several. content/catalogue-examples.yaml says which page shows which and what each one shows. Format
# and recording: scripts/hub_examples.py. The `recorded` blocks are written by `scripts/hub_examples.py --record`, never
# by hand. Every input here was written for the page; every company and person in it is invented.
