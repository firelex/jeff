# More worked examples for the reasoning adapters' catalogue pages (/catalogue/<adapter id>): with each adapter's
# examples on the "Reasoning" page (oss-reasoning.yaml) and its catalogue example (catalogue-open.yaml), five cases per
# adapter, each with a different outcome where the adapter has several. content/catalogue-examples.yaml says which page
# shows which and what each one shows. Format and recording: scripts/hub_examples.py. The `recorded` blocks are
# written by `scripts/hub_examples.py --record`, never by hand. Every input here was written for the page; every
# company and person in it is invented.
- id: more-contradicts-no
  name: Same appointment in two words
  function: jeff.reasoning.contradicts.contradicts
  context:
    setting: The front desk team of a community health clinic reviews patient records before appointments.
    statement_a:
      source: booking system
      text: 'Next appointment: Thursday 12 November 2026, 14:30, with the practice nurse.'
  input:
    source: reminder text sent to the patient
    text: Reminder from Brookfield Health Centre - you are seeing the nurse on Thursday 12 November at 2.30 pm.
  recorded:
    value: 'no'
    confidence: 0.604
    top_options:
    - option: 'no'
      probability: 0.604
    - option: 'yes'
      probability: 0.391
    - option: unclear
      probability: 0.004
    server: v1.4
    at: '2026-11-04'
