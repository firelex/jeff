# The swarm page's examples (guides/the-swarm.md): the open router, jeff.routing.router-open, picks a specialist for
# a request, and the request is then sent to that specialist through the SDK. The router's input is the request as the
# specialist would get it: the question's instructions, its options (the label keys) and its state (the specialist's
# context fields and input, as JSON text). Its labels are the caller's menu of specialists, each with a description,
# and always `base` (the general model, no specialist), with the descriptions the router was trained on. Each
# follow-up example is the matching specialist call (named by the router example's routes_to_example), with the same
# content as its example on the family page (swarm-open-route-ci routes to the family page's own oss-ci-failure);
# --validate checks that the router's request is exactly that specialist call's. Format and recording:
# scripts/hub_examples.py. The `recorded` blocks are written by `scripts/hub_examples.py --record`, never by hand.
- id: swarm-message-triage
  name: Supplier invoice, as the router passes it on
  function: jeff.support.message-triage.action_needed
  context:
    recipient:
      name: Lena Brandt
      address: lena.brandt@hollowayarch.example
      role: Office manager
      organisation: Holloway Architects
    message_kinds:
      invoice: A supplier's bill or a question about one
      booking: Meeting room, travel or event bookings
      it_problem: Something broken with computers, phones or the network
      newsletter: Bulk mail and marketing
    routing_table:
    - key: finance
      name: Finance team
      address: finance@hollowayarch.example
      topics: Supplier invoices, payments, expenses
    - key: it
      name: IT support
      address: it@hollowayarch.example
      topics: Computers, phones, printers, network and accounts
    routing_rules:
    - Anything about a client project's fees goes to the partner on the project, never to finance.
    now: Monday 2 November 2026, 09:40
  input:
    channel: email
    from: billing@greenleafplants.example
    to: lena.brandt@hollowayarch.example
    cc: ''
    received: Monday 2 November 2026, 08:55
    subject: Invoice GL-5520 for October plant care
    body: Hello Lena, please find attached our invoice GL-5520 for October's plant care at your Bristol office, 240.00. Could you arrange payment within 30 days? Kind regards, Greenleaf Plants
  recorded:
    value: forward
    confidence: 0.99
    top_options:
    - option: forward
      probability: 0.99
    - option: do_task
      probability: 0.007
    - option: fyi_only
      probability: 0.001
    server: v1.4
    at: '2026-11-03'
