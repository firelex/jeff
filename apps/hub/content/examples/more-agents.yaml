# More worked examples for the agent adapters' catalogue pages (/catalogue/<adapter id>): with each adapter's example
# on the "Agents" page (oss-agents.yaml) and the assistant-routing adapter's (api-adapters.yaml), five cases per
# adapter, each with a different outcome where the adapter has several. content/catalogue-examples.yaml says which page
# shows which and what each one shows. Format and recording: scripts/hub_examples.py. The `recorded` blocks are
# written by `scripts/hub_examples.py --record`, never by hand. Every input here was written for the page; every
# company and person in it is invented.

- id: more-action-check-approve
  name: Bill paid for the amount on it
  function: jeff.agents.action-check.action
  context:
    app: &pinecrest_app Pinecrest Books, a bookkeeping assistant for a small design studio. It keeps the studio's invoices, clients and supplier bills, emails invoices and pays bills on request.
    today: &pinecrest_today Monday 2 November 2026
    rules: &pinecrest_rules
    - Invoices may be emailed only to an address on the client's record or one the user gives in the conversation.
    - Before deleting an invoice, show it to the user and get a yes to "Delete this invoice?".
    - Pay a supplier bill only for the amount on the bill.
    people: &pinecrest_people
    - Sam Whitley <sam@pinecrest.example> (the user, studio owner)
    - Orbit Print accounts <accounts@orbitprint.example> (client)
    - Inkwell Paper Co billing <billing@inkwellpaper.example> (supplier)
    tools: &pinecrest_tools |-
      def find_invoice(client: str, month: str) -> dict:
          """Finds the studio's invoice for a client and month."""
      def send_invoice(invoice_id: str, to: str, cc: list[str] = []) -> dict:
          """Emails an invoice to a recipient, with optional copies."""
      def delete_invoice(invoice_id: str) -> dict:
          """Deletes an invoice for good."""
      def pay_bill(bill_id: str, amount: float) -> dict:
          """Pays a supplier bill from the studio's bank account."""
    conversation:
    - role: user
      content: Please pay the Inkwell Paper bill, BILL-881, for 480.00.
    latest_user_message: Please pay the Inkwell Paper bill, BILL-881, for 480.00.
  input:
    tool: pay_bill
    arguments:
      bill_id: BILL-881
      amount: 480.00
  recorded:
    value: approve
    confidence: 1.0
    top_options:
    - option: approve
      probability: 1.0
    - option: ask_user
      probability: 0.0
    - option: wrong_action
      probability: 0.0
    server: v1.4
    at: '2026-11-05'
