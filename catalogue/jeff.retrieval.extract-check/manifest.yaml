id: jeff.retrieval.extract-check
version: 1.4.0
aliases:
- oss-extract-check
- extract-check
licence:
  kind: open
  adapter: Apache-2.0
weights:
  open:
    repo: mstrasser/jeff-adapter-extract-check
    revision: v1.4
base:
  id: jeff-base
  version: v1.4
  max_options: 5
context:
- key: document
  description: The document's text.
  required: true
input:
  key: extracted
  description: 'The extracted value to check: an object with `field` (the field''s name) and `value`.'
  form: fields
functions:
  check:
    interface: classify
    type: choice
    instructions: 'Is the extracted value supported by the document? Find where the document states the extracted field and
      compare the values. A value written in another format still matches (dates written differently, amounts with or without
      currency or separators, a name in another order or without a company suffix). correct: the document states this value
      for this field. wrong_value: the document states this field with a different value, and the extracted value is not what
      it gives for another field. wrong_field: the extracted value appears in the document but for a different field (for
      example the tax amount given as the total, or the issue date given as the due date). not_in_document: the document does
      not state this field at all; do not work it out from other values. ambiguous: the document states this field more than
      once with different values, and the extracted value matches one of them.'
    labels:
      source: fixed
      fixed:
        ambiguous: 'Ambiguous: the document states this field more than once with different values, and the extracted value
          matches one of them.'
        correct: 'Correct: the document states this value for this field (in this or another format).'
        not_in_document: 'Not in the document: the document does not state this field at all.'
        wrong_field: 'Wrong field: the extracted value appears in the document, but for a different field (for example the
          tax amount given as the total).'
        wrong_value: 'Wrong value: the document states this field, but with a different value, and the extracted value is
          not what the document gives for another field.'
      subset: false
    abstain_labels: []
    calibration:
      data: hf://mstrasser/jeff-adapter-extract-check@v1.4/calibration.jsonl
      rows: 2000
      target_precision: 0.98
      threshold: 0.482657
      precision_at_threshold: 0.991
      coverage_at_threshold: 1.0
routes_to: []
tests:
  published: hf://mstrasser/jeff-adapter-extract-check@v1.4/test.jsonl
  calibration: hf://mstrasser/jeff-adapter-extract-check@v1.4/calibration.jsonl
  function_by: only
hub:
  title: oss-extract-check
  summary: 'Jeff v1.4 adapter `extract-check`. Checks a value extracted from a document (a field and its value): correct,
    wrong value, wrong field, not in the document, or ambiguous.'
