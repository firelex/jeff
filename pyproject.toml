[project]
name = "jeff"
version = "0.2.0"
description = "One-pass decisions with full-weight supervised training"
readme = "README.md"
requires-python = ">=3.12"
# Serving a checkpoint (jeff-serve) needs only these. Training, data building and evaluation add the "train" group,
# which `uv sync` installs by default; `uv sync --no-default-groups` gives a serving-only install.
dependencies = [
  "torch==2.14.0",
  "torchvision==0.29.0",
  "transformers==5.17.0",
  "pillow==12.3.0",
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "safetensors==0.8.0",
  "numpy==2.5.3",
  "huggingface-hub==1.31.0",
]

[project.optional-dependencies]
# Fast kernels for Qwen3.5 on NVIDIA GPUs (serving and training); without them transformers falls back to much slower code
cuda = ["flash-linear-attention==0.5.2", "kernels==0.16.1"]
# Apple silicon serving (JEFF_BACKEND=mlx)
mac = ["mlx-lm==0.31.3"]
# Game tests (python -m jeff.games) and their videos
games = ["vizdoom==1.3.1", "imageio==2.38.0", "imageio-ffmpeg>=0.6"]
# Chess fine-tune example (examples/chess): python-chess and the Lichess .zst readers
chess = ["chess==1.11.2", "zstandard==0.25.0"]
# LoRA adapters: training them (jeff-train --lora-rank) and serving several on one base (JEFF_ADAPTERS)
lora = ["peft==0.21.1"]

[project.scripts]
jeff-data = "jeff.data:main"
jeff-generate = "jeff.generate:main"
jeff-materials = "jeff.materials:main"
jeff-grounded = "jeff.grounded:main"
jeff-latency = "jeff.latency:main"
jeff-train = "jeff.train:main"
jeff-evaluate = "jeff.evaluate:main"
jeff-serve = "jeff.server:main"
jeff-panel = "jeff.panel:main"
jeff-dashboard = "jeff.dashboard:main"
jeff-mix = "jeff.mix:main"
jeff-extra = "jeff.extra:main"
jeff-voice = "jeff.voice:main"
jeff-jevbench = "jeff.jevbench:main"
jeff-sampled = "jeff.sampled:main"
jeff-probability = "jeff.probability:main"
jeff-prm = "jeff.prm:main"
jeff-codecontests = "jeff.codecontests:main"
jeff-legalbench = "jeff.legalbench:main"
jeff-kit = "jeff.kit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
required-version = ">=0.12.19"
default-groups = ["dev", "train"]  # plain `uv sync` keeps installing everything

[dependency-groups]
dev = ["mypy>=2.3.1", "pytest>=8.4", "peft==0.21.1"]  # peft: the LoRA tests
# Training, data building and evaluation (jeff-train, jeff-data, jeff-generate, jeff-evaluate, ...)
train = [
  "accelerate==1.15.0",
  "datasets==5.0.1",
  "httpx==0.28.1",
  "matplotlib==3.11.2",
  "python-dotenv==1.2.3",
  "flash-linear-attention==0.5.2",
  "kernels==0.16.1",
]

[tool.mypy]
files = ["src/jeff"]
python_version = "3.12"
strict = true
cache_dir = ".cache/mypy"
untyped_calls_exclude = ["transformers", "datasets", "torch._tensor.Tensor.backward"]

[[tool.mypy.overrides]]
module = ["datasets.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: downloads model weights or uses the GPU heavily"]
