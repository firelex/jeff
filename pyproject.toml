[project]
name = "jeff-workspace"
version = "0.0.0"
requires-python = ">=3.13"

[tool.uv]
required-version = ">=0.12.19"

[tool.uv.workspace]
members = ["packages/python", "runtime/python", "apps/server"]

[tool.uv.sources]
jeff-sdk = { workspace = true }
jeff-runtime = { workspace = true }
jeff-server = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.4",
    "mypy>=2.3.1",
    "jeff-sdk",
    "jeff-runtime[mac]; sys_platform == 'darwin'",
    "jeff-runtime[cuda]; sys_platform == 'linux'",
    "jeff-server",
    "httpx>=0.28",
    "types-pyyaml>=6.0",
    "types-jsonschema>=4.25",
    "openapi-spec-validator>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["packages/python/tests", "runtime/python/tests", "apps/server/tests", "scripts/tests"]
markers = [
  "slow: loads real model weights (run one slow process at a time on the Mac)",
  "cuda: needs an NVIDIA GPU (skipped elsewhere)",
  "hf_cache: reads Hugging Face files from this machine's cache, offline (skipped, saying why, when they are absent)",
]
addopts = "-m 'not slow and not cuda'"
filterwarnings = [
  # Triton 3.8's code generator builds ast.AnnAssign without `simple`, which Python 3.13 deprecates: Triton's own
  # warning (module triton.compiler.code_generator), raised whenever a kernel compiles, not something in this code.
  "ignore:AnnAssign.__init__ missing:DeprecationWarning:triton",
]
