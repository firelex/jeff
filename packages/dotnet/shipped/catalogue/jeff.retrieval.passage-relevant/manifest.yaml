id: jeff.retrieval.passage-relevant
version: 1.4.0
aliases:
- oss-passage-relevant-v2
- passage-relevant
licence:
  kind: open
  adapter: Apache-2.0
weights:
  open:
    repo: mstrasser/jeff-adapter-passage-relevant
    revision: v1.4
base:
  id: jeff-base
  version: v1.4
  max_options: 3
context:
- key: source
  description: 'Where the passage comes from: the collection''s name and a description of what it holds.'
  required: true
- key: question
  description: The question to answer.
  required: true
input:
  key: passage
  description: The retrieved passage's text.
  form: fields
functions:
  relevant:
    interface: classify
    type: choice
    instructions: 'Does the passage answer the question? Check who or what the passage is about (the named person, organisation,
      site, product or case), the period or date it covers, and every detail the question asks for. yes: the passage states
      every asked detail for the right subject and period (other content around it does not matter). partly: the passage is
      about the right subject and period and states at least one of the asked details but not all of them; for a question
      about several periods, it covers only some of them. no: the passage is about a different subject (even one with a similar
      name) or a different period, states none of the asked details (only related facts), or only says that the asked detail
      is not known or not decided yet.'
    labels:
      source: fixed
      fixed:
        'no': 'No: the passage is about a different subject or period, states none of the asked details (only related facts),
          or only says the detail is not known yet.'
        partly: 'Partly: the passage is about the right subject and period and states at least one asked detail, but not all
          of them (or covers only some of the asked periods).'
        'yes': 'Yes: the passage states every detail the question asks for, for the right subject and period.'
      subset: false
    abstain_labels: []
    calibration:
      data: hf://mstrasser/jeff-adapter-passage-relevant@v1.4/calibration.jsonl
      rows: 2000
      target_precision: 0.98
      threshold: 0.521208
      precision_at_threshold: 0.9945
      coverage_at_threshold: 1.0
routes_to: []
tests:
  published: hf://mstrasser/jeff-adapter-passage-relevant@v1.4/test.jsonl
  calibration: hf://mstrasser/jeff-adapter-passage-relevant@v1.4/calibration.jsonl
  function_by: only
hub:
  title: oss-passage-relevant-v2
  summary: 'Jeff v1.4 adapter `passage-relevant`. For search and retrieval: checks whether a passage answers a question for
    the right subject and period: yes, partly or no.'
