id: jeff.routing.tools
version: 1.4.0
aliases:
- tools
licence:
  kind: open
  adapter: Apache-2.0
weights:
  open:
    repo: mstrasser/jeff-adapter-tools
    revision: v1.4
base:
  id: jeff-base
  version: v1.4
  max_options: 152
context:
- key: agent
  description: What the agent is for, in one or two sentences (for example a triage assistant that checks entitlements before
    routing tickets).
  required: true
- key: conversation
  description: The conversation so far, a list of turns, each {role (user or assistant), text}.
  required: true
input:
  key: user_message
  description: The user's latest message, as plain text.
  form: fields
functions:
  tool:
    interface: route
    type: choice
    instructions: Which tool should the agent call next to handle the user's latest message? Use the conversation for context.
      If no tool is needed, choose answer directly. If a tool is needed but information it requires is missing, choose ask
      the user.
    labels:
      source: caller
      fixed_first:
        answer_directly: 'No tool is needed: answer the user directly from the conversation'
        ask_user: 'A tool is needed but required information is missing: ask the user first'
      caller_keys: t{n}
      max: 134
    abstain_labels: []
    calibration:
      data: hf://mstrasser/jeff-adapter-tools@v1.4/calibration.jsonl
      rows: 2195
      target_precision: 0.95
      threshold: 0.274674
      precision_at_threshold: 0.97631
      coverage_at_threshold: 1.0
routes_to: []
tests:
  published: hf://mstrasser/jeff-adapter-tools@v1.4/test.jsonl
  calibration: hf://mstrasser/jeff-adapter-tools@v1.4/calibration.jsonl
  function_by: only
hub:
  title: Agent tool choice
  summary: Picks the next tool for an AI agent to call, or says to answer directly or to ask the user for missing information.
  task: routing
  kind: official
  maintainer:
    name: Jeff maintainers
    github: firelex
