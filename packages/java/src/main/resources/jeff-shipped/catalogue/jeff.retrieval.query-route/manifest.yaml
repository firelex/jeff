id: jeff.retrieval.query-route
version: 1.4.0
aliases:
- oss-query-route
- query-route
licence:
  kind: open
  adapter: Apache-2.0
weights:
  open:
    repo: mstrasser/jeff-adapter-query-route
    revision: v1.4
base:
  id: jeff-base
  version: v1.4
  max_options: 13
context:
- key: menu
  description: The sources a query can be sent to (document collections, indexes, databases, tools), written as tool definitions
    with names and descriptions.
  required: true
input:
  key: query
  description: The user's query.
  form: fields
functions:
  source:
    interface: route
    type: choice
    instructions: 'Which of the sources on the menu should this query be sent to? Each source (a document collection, index,
      database or tool) is described on the menu. Choose the one source whose contents answer the query; judge by what each
      source holds, not by words the query shares with a source''s name. none: no source on the menu holds what the query
      needs (it belongs to a source that is not listed), or the message needs no lookup at all (a greeting, thanks, or a request
      to reword text). several: answering needs facts from two or more different sources on the menu, because no single source
      holds all of them.'
    labels:
      source: caller
      fixed_first: {}
      caller_keys: null
      max: 13
    abstain_labels: []
    calibration:
      data: hf://mstrasser/jeff-adapter-query-route@v1.4/calibration.jsonl
      rows: 2000
      target_precision: 0.95
      threshold: 0.342544
      precision_at_threshold: 0.987
      coverage_at_threshold: 1.0
routes_to: []
tests:
  published: hf://mstrasser/jeff-adapter-query-route@v1.4/test.jsonl
  calibration: hf://mstrasser/jeff-adapter-query-route@v1.4/calibration.jsonl
  function_by: only
hub:
  title: oss-query-route
  summary: Jeff v1.4 adapter `query-route`. Sends a query to the right source on a menu of document collections, databases
    and tools; or none, or several.
