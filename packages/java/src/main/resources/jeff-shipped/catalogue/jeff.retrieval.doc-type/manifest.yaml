id: jeff.retrieval.doc-type
version: 1.4.0
aliases:
- oss-doc-type
- doc-type
licence:
  kind: open
  adapter: Apache-2.0
weights:
  open:
    repo: mstrasser/jeff-adapter-doc-type
    revision: v1.4
base:
  id: jeff-base
  version: v1.4
  max_options: 11
context:
- key: sorting_desk
  description: 'Where the document arrived: a sentence describing the inbox or team that sorts it.'
  required: true
input:
  key: document
  description: The document's text.
  form: fields
functions:
  doc_type:
    interface: classify
    type: choice
    instructions: 'Which type of document is this? Choose one type from the list, using the descriptions. Judge by what the
      document is and does (its purpose, who sends it to whom, what it asks for or records), not by words it mentions in passing:
      a quote that says an invoice will follow is still a quote. The title may be missing or worded differently from the type
      names. When two listed types are similar, the descriptions say how to tell them apart. other: the document is none of
      the listed types, even when a listed type is similar to it.'
    labels:
      source: caller
      fixed_first: {}
      caller_keys: null
      max: 11
    abstain_labels: []
    calibration:
      data: hf://mstrasser/jeff-adapter-doc-type@v1.4/calibration.jsonl
      rows: 2000
      target_precision: 0.95
      threshold: 0.497832
      precision_at_threshold: 0.978
      coverage_at_threshold: 1.0
routes_to: []
tests:
  published: hf://mstrasser/jeff-adapter-doc-type@v1.4/test.jsonl
  calibration: hf://mstrasser/jeff-adapter-doc-type@v1.4/calibration.jsonl
  function_by: only
hub:
  title: oss-doc-type
  summary: Jeff v1.4 adapter `doc-type`. Sorts a document into one of the types on a list (each with a description), or other.
