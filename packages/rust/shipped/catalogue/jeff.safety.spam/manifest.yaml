id: jeff.safety.spam
version: 1.4.0
aliases:
- spam
licence:
  kind: open
  adapter: Apache-2.0
weights:
  open:
    repo: mstrasser/jeff-adapter-spam
    revision: v1.4
base:
  id: jeff-base
  version: v1.4
  max_options: 3
context:
- key: channel
  description: 'Where the message came from: "sms" or "email", as in training.'
  required: true
input:
  key: message
  description: The text of the message as received. For an email, its subject and readable body (no other headers, no attachments).
  form: fields
functions:
  is_spam:
    interface: detect
    type: noul
    instructions: Is this message spam or phishing? Answer yes if it is unwanted bulk or advertising, or a scam trying to
      get personal details or money; answer no if it is a normal message.
    labels:
      source: fixed
      fixed:
        'false': 'The message is a normal message: not unwanted bulk or advertising, and not a scam.'
        'true': The message is spam (unwanted bulk or advertising) or phishing (a scam trying to get personal details, passwords
          or money).
    abstain_labels: []
    calibration:
      data: hf://mstrasser/jeff-adapter-spam@v1.4/calibration.jsonl
      rows: 1113
      target_precision: 0.98
      threshold: 0.515807
      precision_at_threshold: 0.991914
      coverage_at_threshold: 1.0
  message_type:
    interface: classify
    type: choice
    instructions: 'What kind of message is this: a legitimate message, spam (unwanted bulk or advertising), or phishing (a
      scam trying to get personal details, passwords or money)?'
    labels:
      source: fixed
      fixed:
        legitimate: A normal message from a person or a genuine organisation, not spam and not phishing.
        phishing: A scam message that tries to trick the reader into giving personal details, passwords or money, often by
          pretending to be a bank, company or authority and asking them to click a link or call a number.
        spam: Unwanted bulk or advertising message (for example prizes, offers, premium-rate services), but not trying to
          steal personal or account details.
      subset: false
    abstain_labels: []
    calibration:
      data: hf://mstrasser/jeff-adapter-spam@v1.4/calibration.jsonl
      rows: 832
      target_precision: 0.98
      threshold: 0.425658
      precision_at_threshold: 0.980769
      coverage_at_threshold: 1.0
routes_to: []
tests:
  published: hf://mstrasser/jeff-adapter-spam@v1.4/test.jsonl
  calibration: hf://mstrasser/jeff-adapter-spam@v1.4/calibration.jsonl
  function_by: id_suffix
hub:
  title: Spam and phishing in SMS and email
  summary: Says whether a text message or email is spam or phishing, and whether it is legitimate, spam or a phishing scam.
  task: safety
  kind: official
  maintainer:
    name: Jeff maintainers
    github: firelex
