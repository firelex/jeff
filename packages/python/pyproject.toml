[project]
name = "jeff-sdk"
version = "1.4.0"
description = "The Jeff SDK for Python (imported as jeff): call Jeff's decision functions, route, escalate and run decision graphs, against a Jeff server or the engine in your own process."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Casperaki Multimedia Solutions Ltd." }]
keywords = ["jeff", "decision functions", "classification", "llm", "adapters", "routing", "sdk"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml>=6.0.2",
    "jsonschema>=4.25",
    "ruamel.yaml>=0.18.10",
    "huggingface-hub==1.31.0",
    "msgpack>=1.1",
    "httpx>=0.28",
    "websockets==17.3",
]

[project.urls]
Homepage = "https://jeffhub.ai"
Documentation = "https://jeffhub.ai/docs"
Repository = "https://github.com/firelex/jeff"
Source = "https://github.com/firelex/jeff/tree/main/packages/python"

[project.scripts]
jeff = "jeff.cli:main"

[project.optional-dependencies]
mcp = [
    "mcp>=2.3.0,<2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jeff"]

# The source distribution: the code, the README and the licence (the tests read the repository around the package).
[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE"]
