  /health:
    get:
      summary: Report whether this deployment can answer requests.
      description: 'Needs no credentials, and has no rate limit at all (unlike every other route here).
        On a public server, a caller sending none gets only HealthStatusOnly (cached for a short time,
        so a flood of unsigned checks is never engine traffic); a signed-in caller, and any caller on
        a private server, gets the full HealthReport. status: ''ready'' (every engine ready, and they
        agree on what they serve), ''degraded'' (some engine down or broken, but the ready ones agree
        and keep answering), or ''broken'' (no engine ready, or the ready ones disagree on what they serve:
        then only requests for adapters every engine serves are answered).'
      responses:
        '200':
          description: The deployment's health.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                description: 'Told apart by which shape matches. No discriminator property is added: the
                  wire has none.'
                oneOf:
                - $ref: '#/components/schemas/HealthStatusOnly'
                - $ref: '#/components/schemas/HealthReport'
        '401':
          description: HTTP 401; see contract/errors.yaml for which error type(s) answer with this status.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            WWW-Authenticate:
              description: Bearer, unless the 401 is for console sign-in itself, which no bearer token
                would fix.
