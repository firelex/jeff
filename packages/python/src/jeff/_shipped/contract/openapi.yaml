      - {}
  /v1/adapters/served:
    put:
      summary: Replace what every engine serves.
      description: 'Every engine process is changed to serve exactly this set (not added to its current
        list), concurrently; all must accept it, or none of the engines are left changed when the check
        that runs before any change (a served set that would leave a router without one of its targets)
        fails. Validated against served_request; an adapter string must not be empty ("" is 422 InvalidRequest,
        naming where). Owner-only: needs the server''s own credentials (the API key or a console session
        token from POST /ui/login), never a hub-signed token, which belongs to a customer and is refused
        with 403 NotLicensed. With no credentials configured on the server, every caller is the owner.
        Refused as 422 InvalidRequest on a public server (JEFF_PUBLIC=1): a public server''s served adapters
        stay as started.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/served_request'
      responses:
