components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Authorization: Bearer <token>. Three kinds of token are accepted, each only when the
        server has it configured: the server''s own API key (JEFF_API_KEY); a console session token from
        POST /ui/login (JEFF_UI_USERS); or a hub-signed JSON Web Token (JEFF_HUB_PUBLIC_KEY), algorithm
        EdDSA (Ed25519), carrying sub, licences (the adapter IDs it may call), iat and exp, lasting at
        most 3600 seconds -- the server never calls the hub to check one. When the server has none of
        these configured, the API is open: every caller is treated as the owner without sending a token
        at all. A public server (JEFF_PUBLIC=1) always has at least one of these configured, so a token
        is then always required.'
  headers:
    XRequestId:
      description: A 32-character lowercase-hex request id, set on every response this server sends (even
        one Starlette's own ServerErrorMiddleware sends for an exception no handler caught -- see jeff_server.app._Application).
      schema:
        type: string
        pattern: ^[0-9a-f]{32}$
  schemas:
    decision:
      title: Jeff decision
      type: object
      additionalProperties: false
      required:
      - value
      - confidence
      - abstained
      - calibrated
      - interface
      - function
      - version
      - probabilities
      - score
      - route
      - decided_by
      - escalations
      - timing
      - evidence_refs
      properties:
        value:
          type:
          - string
          - boolean
          - integer
        confidence:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
        abstained:
          type: boolean
        calibrated:
          type: boolean
        interface:
          type: string
        function:
          type: string
          description: 'The function that decided, by its own ID (the adapter''s ID, a dot, the function''s
            key): the versioned ID even when the call named the function through an alias, so jeff.routing.router-open.specialist
            is answered with jeff.routing.router-open-v14.specialist.'
        version:
          type: string
          description: The version of the adapter that decided.
        probabilities:
          type: object
          additionalProperties:
            type: number
            minimum: 0
            maximum: 1
        score:
          type:
          - number
          - 'null'
        route:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - router
            - chose
            - confidence
            properties:
              router:
                type: string
              chose:
                type: string
              confidence:
                type: number
        decided_by:
          type: string
        escalations:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - decided_by
            - value
            - confidence
            - reason
            properties:
              decided_by:
                type: string
              value:
                type:
                - string
                - boolean
                - integer
              confidence:
                type:
                - number
                - 'null'
              reason:
                type: string
        timing:
          type: object
        evidence_refs:
          type: array
          items:
            type: string
    graph:
      title: Jeff decision graph
      type: object
      additionalProperties: false
      required:
      - graph
      - version
      - input
      - params
      - nodes
      - outputs
      properties:
        graph:
          type: string
          pattern: ^jeff(\.[a-z0-9][a-z0-9_-]*){2}$|^[a-z][a-z0-9_-]*$
        version:
          type: string
          pattern: ^\d+\.\d+\.\d+$
        input:
          type: string
        params:
          type: array
          items:
            type: string
        nodes:
          type: object
          minProperties: 1
          additionalProperties:
            $ref: '#/components/schemas/graph/$defs/node'
        outputs:
          type: array
          items:
            type: string
          minItems: 1
      $defs:
        param:
          type: object
          additionalProperties: false
          required:
          - param
          properties:
            param:
              type: string
        node:
          type: object
          additionalProperties: false
          oneOf:
          - required:
            - call
          - required:
            - code
          properties:
            call:
              type: string
            code:
              type: string
            after:
              type: array
              items:
                type: string
            context:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/graph/$defs/param'
              description: The called function's context fields, each keyed by its code name (the code_name
                GET /v1/functions lists, as every caller passes context; 'counterparty_name' for the manifest
                key 'counterparty name'), never by the exact key with spaces, which is refused (UnknownContext,
                naming the code name), and mapped to a graph param.
            labels:
              $ref: '#/components/schemas/graph/$defs/param'
            when:
              $ref: '#/components/schemas/graph/$defs/condition'
            on_low_confidence:
              enum:
              - return
              - error
        condition:
          oneOf:
          - type: object
            additionalProperties: false
            required:
            - all
            properties:
              all:
                type: array
                items:
                  $ref: '#/components/schemas/graph/$defs/condition'
                minItems: 1
          - type: object
            additionalProperties: false
            required:
            - any
            properties:
              any:
                type: array
                items:
                  $ref: '#/components/schemas/graph/$defs/condition'
                minItems: 1
          - type: object
            additionalProperties: false
            required:
            - not
            properties:
              not:
                $ref: '#/components/schemas/graph/$defs/condition'
          - type: object
            additionalProperties: false
            required:
            - node
            - is
            properties:
              node:
                type: string
              is:
                type:
                - string
                - boolean
                - integer
          - type: object
            additionalProperties: false
            required:
            - node
            - in
            properties:
              node:
                type: string
              in:
                type: array
                items:
                  type:
                  - string
                  - boolean
                  - integer
                minItems: 1
          - type: object
            additionalProperties: false
            required:
            - node
            - abstained
            properties:
              node:
                type: string
              abstained:
                type: boolean
          - type: object
            additionalProperties: false
            required:
            - node
            - confidence_below
            properties:
              node:
                type: string
              confidence_below:
                type: number
    graph_result:
      title: Jeff decision graph result
      description: 'What running a decision graph returns: every node''s result, the graph''s outputs
        (the same results, for the nodes the graph names as outputs) and how many batched stages it took.
        A model node''s result is its Decision; a skipped node''s is {skipped: true, reason}; a code node''s
        is whatever the caller''s code returned, under ''code''.'
      type: object
      additionalProperties: false
      required:
      - nodes
      - outputs
      - stages
      properties:
        nodes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/graph_result/$defs/result'
        outputs:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/graph_result/$defs/result'
        stages:
          type: integer
          minimum: 0
      $defs:
        result:
          oneOf:
          - type: object
            additionalProperties: false
            required:
            - decision
            properties:
              decision:
                $ref: '#/components/schemas/decision'
          - type: object
            additionalProperties: false
            required:
            - skipped
            - reason
            properties:
              skipped:
                const: true
              reason:
                type: string
          - type: object
            additionalProperties: false
            required:
            - code
            properties:
              code: true
    decide_request:
      title: Jeff POST /v1/decide request
      description: 'Exactly one of three shapes. ''calls'': up to 256 function calls, answered in order.
        ''dispatch'': one input routed through router functions to the function that should answer it.
        ''graph'': a registered graph (by id) or an inline graph without code nodes and with at most 256
        nodes. on_low_confidence says what happens when a decision abstains: ''return'' it (the default),
        raise LowConfidence (''error''), or escalate through other functions in order (function references
        only, at most 256); escalation to an LLM, a person or another server runs in the SDK, not here.'
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - calls
        properties:
          calls:
            type: array
            minItems: 1
            maxItems: 256
            items:
              $ref: '#/components/schemas/decide_request/$defs/call'
          on_low_confidence:
            $ref: '#/components/schemas/decide_request/$defs/policy'
      - type: object
        additionalProperties: false
        required:
        - dispatch
        properties:
          dispatch:
            $ref: '#/components/schemas/decide_request/$defs/dispatch'
          on_low_confidence:
            $ref: '#/components/schemas/decide_request/$defs/policy'
      - type: object
        additionalProperties: false
        required:
        - graph
        - input
        - params
        properties:
          graph:
            $ref: '#/components/schemas/decide_request/$defs/graph'
          input: true
          params:
            type: object
          on_low_confidence_by_node:
            type: object
            maxProperties: 256
            additionalProperties:
              $ref: '#/components/schemas/decide_request/$defs/policy'
      $defs:
        context:
          type:
          - object
          - 'null'
          description: 'Context field code name -> value: each field by the code_name GET /v1/functions
            lists for it (the manifest''s key itself unless that key has spaces or other characters a
            name in code cannot have, for example counterparty_name for the key ''counterparty name'');
            null is the same as leaving it out.'
        labels:
          description: An object of label key -> description (null for none), or a list of label keys
            for a function that offers a subset of its own labels; null is the same as leaving it out.
          oneOf:
          - type: object
            additionalProperties:
              type:
              - string
              - 'null'
          - type: array
            items:
              type: string
          - type: 'null'
        call:
          type: object
          additionalProperties: false
          required:
          - function
          - input
          properties:
            function:
              type: string
              minLength: 1
            input: true
            context:
              $ref: '#/components/schemas/decide_request/$defs/context'
            labels:
              $ref: '#/components/schemas/decide_request/$defs/labels'
        dispatch:
          type: object
          additionalProperties: false
          required:
          - input
          - interface
          properties:
            input: true
            interface:
              type: string
              minLength: 1
            context:
              $ref: '#/components/schemas/decide_request/$defs/context'
            labels:
              $ref: '#/components/schemas/decide_request/$defs/labels'
            router:
              type: string
              minLength: 1
              description: The router to start from; jeff.core.router when absent.
        graph:
          oneOf:
          - type: object
            additionalProperties: false
            required:
            - id
            properties:
              id:
                type: string
                minLength: 1
          - type: object
            additionalProperties: false
            required:
            - inline
            properties:
              inline:
                allOf:
                - $ref: '#/components/schemas/graph'
                - properties:
                    nodes:
                      maxProperties: 256
                  description: An inline graph has at most 256 nodes.
        policy:
          oneOf:
          - enum:
            - return
            - error
          - type: object
            additionalProperties: false
            required:
            - escalate
            properties:
              escalate:
                type: array
                minItems: 1
                maxItems: 256
                items:
                  type: string
                  minLength: 1
                description: Function references to try in order, each implementing the same interface.
              budget_ms:
                type: number
                exclusiveMinimum: 0
    decide_response:
      title: Jeff POST /v1/decide response
      description: 'One reply per request shape: ''decisions'' (in call order) for ''calls'', ''decision''
        (with its route) for ''dispatch'', ''graph_result'' for ''graph''.'
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - decisions
        properties:
          decisions:
            type: array
            items:
              $ref: '#/components/schemas/decision'
      - type: object
        additionalProperties: false
        required:
        - decision
        properties:
          decision:
            $ref: '#/components/schemas/decision'
      - type: object
        additionalProperties: false
        required:
        - graph_result
        properties:
          graph_result:
            $ref: '#/components/schemas/graph_result'
    functions_response:
      title: Jeff GET /v1/functions response
      description: Every function of every adapter the server's engine has loaded, with what a caller
        needs to call it (the same fields as the adapter's manifest), and the weight format of the base
        it serves.
      type: object
      additionalProperties: false
      required:
      - base_format
      - functions
      properties:
        base_format:
          type: object
          additionalProperties: false
          required:
          - format
          description: 'The weight format of the base the server''s engines serve (as their health''s
            base.format and base.format_id): {"format": "bf16"}, or for an INT4 base {"format": "int4-g64",
            "format_id": <that INT4 base''s name>}. On an INT4 base a function decides with its calibration_by_format
            entry for format_id, not with calibration.'
          properties:
            format:
              type: string
              minLength: 1
            format_id:
              type: string
              minLength: 1
        functions:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - id
            - interface
            - type
            - labels
            - context
            - input
            - calibration
            - adapter_version
            - licence
            properties:
              id:
                type: string
                description: 'The function''s own ID: the adapter''s ID, a dot, the function''s key.'
              aliases:
                type: array
                items:
                  type: string
                description: 'The other references that name this function: each of its adapter''s aliases
                  (in its manifest''s order), a dot and the function''s key, for example jeff.routing.router-open.specialist
                  for jeff.routing.router-open-v14.specialist, or spam.is_spam for jeff.safety.spam.is_spam.
                  A decision made through one of them still reports id. This server always sends it; it
                  is not required, so a client still reads the answer of a server from before the field
                  (read a missing one as an empty list).'
              interface:
                type: string
              type:
                enum:
                - choice
                - noul
                - score
              labels:
                type: object
                additionalProperties: false
                required:
                - source
                properties:
                  source:
                    enum:
                    - fixed
                    - caller
                    - subset
                    - describe
                    description: 'fixed: the labels are always ''fixed''. caller: the caller passes its
                      own labels (a key -> description object), listed after ''fixed_first'' and renamed
                      to ''caller_keys'' on the wire when set. subset: ''fixed'' holds every allowed label
                      and the caller passes the list of keys to offer, which must include ''required''.
                      describe: the keys are always ''keys'', in that order, and the caller passes an
                      object with exactly those keys whose values are the descriptions.'
                  fixed:
                    type: object
                    additionalProperties:
                      type:
                      - string
                      - 'null'
                  levels:
                    type: array
                    items:
                      type: string
                    minItems: 2
                    maxItems: 10
                  fixed_first:
                    type: object
                    additionalProperties:
                      type:
                      - string
                      - 'null'
                  caller_keys:
                    type:
                    - string
                    - 'null'
                    pattern: ^[a-z]+\{n\}$
                  max:
                    type: integer
                    minimum: 1
                    maximum: 255
                  required:
                    type: array
                    items:
                      type: string
                    description: 'subset: keys the caller must always offer.'
                  keys:
                    type: array
                    items:
                      type: string
                    minItems: 1
                    description: 'describe: the fixed keys, in the trained order.'
                  subset:
                    type: boolean
                    description: 'Required for fixed labels of a choice function, and absent everywhere
                      else. false: the caller passes no labels, and every fixed label is offered. true:
                      the caller may pass labels as a non-empty list of fixed keys (no repeats) to offer
                      only those, listed in the order of ''fixed'' with their fixed descriptions; without
                      labels, every fixed label is offered.'
              context:
                allOf:
                - type: array
                  description: 'The context fields: values a caller binds once and that Jeff sends before
                    the input, in this order.'
                  items:
                    type: object
                    additionalProperties: false
                    required:
                    - key
                    - description
                    - required
                    properties:
                      key:
                        type: string
                        minLength: 1
                        maxLength: 60
                        pattern: ^(?![\u0020\u00a0\u1680\u2000-\u200a\u2028\u2029\u202f\u205f\u3000\ufeff])(?![\s\S]*[\u0020\u00a0\u1680\u2000-\u200a\u2028\u2029\u202f\u205f\u3000\ufeff]$)(?![\s\S]*[\u0000-\u001f\u007f-\u009f\u2028\u2029])
                        description: 'A context or input field''s key exactly as the adapter was trained
                          on it, and as the prompt shows it: any printable text of 1 to 60 characters
                          (for example ''counterparty name''). Refused: control characters and the Unicode
                          line and paragraph separators (U+2028, U+2029) anywhere, and a whitespace character
                          at either end: the space, the no-break spaces (U+00A0, U+202F), every other
                          Unicode space separator (U+1680, U+2000 to U+200A, U+205F, U+3000) and the byte
                          order mark (U+FEFF). Whitespace other than those separators may appear inside
                          a key. Callers never use it; they use the field''s code name.'
                      code_name:
                        type: string
                        pattern: ^[a-z][a-z0-9_]*$
                        description: 'The name callers use for a context field: SDK context, HTTP and
                          channel context keys, MCP tool arguments and the function listing. Absent: a
                          key of the form ^[a-z][a-z0-9_]*$ is its own code name, unchanged, as before
                          code names existed; any other key is lower-cased, with every run of characters
                          other than a-z and 0-9 replaced by one underscore and underscores trimmed from
                          both ends (''counterparty name'' -> counterparty_name). Declare it when that
                          rule gives no name of the form ^[a-z][a-z0-9_]*$. Two fields of one manifest
                          (context and input together) may not share a code name. The input''s code_name
                          takes part only in that check (and is listed by GET /v1/functions): callers
                          always pass the input as ''input''.'
                      description:
                        type: string
                        minLength: 1
                      required:
                        type: boolean
                - type: array
                  items:
                    required:
                    - code_name
                description: 'The function''s context fields (its own when the manifest declares them
                  for the function, else the adapter''s), each with its code_name always given (declared
                  or derived): callers pass context by code name; key is the field as the prompt shows
                  it.'
              input:
                allOf:
                - type: object
                  additionalProperties: false
                  required:
                  - key
                  - description
                  - form
                  description: 'The input: the one value a caller passes with every call (as ''input''),
                    as opposed to the context, which is bound once. Its form says how the adapter was
                    trained to see it, and so what Jeff sends the model.'
                  properties:
                    key:
                      type: string
                      minLength: 1
                      maxLength: 60
                      pattern: ^(?![\u0020\u00a0\u1680\u2000-\u200a\u2028\u2029\u202f\u205f\u3000\ufeff])(?![\s\S]*[\u0020\u00a0\u1680\u2000-\u200a\u2028\u2029\u202f\u205f\u3000\ufeff]$)(?![\s\S]*[\u0000-\u001f\u007f-\u009f\u2028\u2029])
                      description: 'A context or input field''s key exactly as the adapter was trained
                        on it, and as the prompt shows it: any printable text of 1 to 60 characters (for
                        example ''counterparty name''). Refused: control characters and the Unicode line
                        and paragraph separators (U+2028, U+2029) anywhere, and a whitespace character
                        at either end: the space, the no-break spaces (U+00A0, U+202F), every other Unicode
                        space separator (U+1680, U+2000 to U+200A, U+205F, U+3000) and the byte order
                        mark (U+FEFF). Whitespace other than those separators may appear inside a key.
                        Callers never use it; they use the field''s code name.'
                    code_name:
                      type: string
                      pattern: ^[a-z][a-z0-9_]*$
                      description: 'The name callers use for a context field: SDK context, HTTP and channel
                        context keys, MCP tool arguments and the function listing. Absent: a key of the
                        form ^[a-z][a-z0-9_]*$ is its own code name, unchanged, as before code names existed;
                        any other key is lower-cased, with every run of characters other than a-z and
                        0-9 replaced by one underscore and underscores trimmed from both ends (''counterparty
                        name'' -> counterparty_name). Declare it when that rule gives no name of the form
                        ^[a-z][a-z0-9_]*$. Two fields of one manifest (context and input together) may
                        not share a code name. The input''s code_name takes part only in that check (and
                        is listed by GET /v1/functions): callers always pass the input as ''input''.'
                    description:
                      type: string
                      minLength: 1
                    form:
                      enum:
                      - fields
                      - text
                      description: 'Required. fields: the state Jeff sends is an object of named fields,
                        the context fields in the manifest''s order and then the input under its key (the
                        prompt shows the key). text: the adapter was trained on a state that is one plain
                        string, so the state Jeff sends is the caller''s input itself, unwrapped; the
                        input must be a string, the manifest may have no context fields, and a call that
                        passes context is refused (UnknownContext). With text the key appears nowhere
                        in the prompt: it only gives the input its code name, which the function listing
                        and the console use to name it.'
                - required:
                  - code_name
                description: The function's input field (its own when the manifest declares it for the
                  function, else the adapter's), with its code_name always given (declared or derived).
              calibration:
                oneOf:
                - type: 'null'
                - type: object
                  additionalProperties: false
                  required:
                  - data
                  - rows
                  - target_precision
                  - threshold
                  - precision_at_threshold
                  - coverage_at_threshold
                  properties:
                    data:
                      type: string
                    data_mirror:
                      type: object
                      additionalProperties: false
                      required:
                      - path
                      - sha256
                      description: 'Present when the calibration rows were read from a local copy of the
                        data (the JEFF_DATA_MIRROR setting) instead of from where ''data'' names, which
                        stays the hf:// URI: the local file that was read (path) and its SHA-256 (sha256),
                        so a refit elsewhere can tell whether it reads the same bytes. Absent: the rows
                        were read from ''data'' itself.'
                      properties:
                        path:
                          type: string
                          minLength: 1
                        sha256:
                          type: string
                          pattern: ^[0-9a-f]{64}$
                    rows:
                      type: integer
                      minimum: 1
                    target_precision:
                      type: number
                      exclusiveMinimum: 0
                      maximum: 1
                    threshold:
                      type: number
                      minimum: 0
                      maximum: 1
                    precision_at_threshold:
                      type: number
                      minimum: 0
                      maximum: 1
                    coverage_at_threshold:
                      type: number
                      minimum: 0
                      maximum: 1
              calibration_by_format:
                type: object
                minProperties: 1
                propertyNames:
                  minLength: 1
                description: 'The function''s calibration on other base formats, keyed by an INT4 base''s
                  format_id (its decision_config.json quantization.format_id): the threshold for exactly
                  those INT4 weights, written by `jeff calibrate <function> --base <int4 folder>`. `calibration`
                  stays the block for the bfloat16 base as released. A function with calibration null
                  has no entries (it is uncalibrated in every format). An engine serving an INT4 base
                  whose format_id has no entry here refuses to bind the function.'
                additionalProperties:
                  type: object
                  additionalProperties: false
                  required:
                  - data
                  - rows
                  - excluded
                  - target_precision
                  - threshold
                  - precision_at_threshold
                  - coverage_at_threshold
                  properties:
                    data:
                      type: string
                    data_mirror:
                      type: object
                      additionalProperties: false
                      required:
                      - path
                      - sha256
                      description: 'Present when the calibration rows were read from a local copy of the
                        data (the JEFF_DATA_MIRROR setting) instead of from where ''data'' names, which
                        stays the hf:// URI: the local file that was read (path) and its SHA-256 (sha256),
                        so a refit elsewhere can tell whether it reads the same bytes. Absent: the rows
                        were read from ''data'' itself.'
                      properties:
                        path:
                          type: string
                          minLength: 1
                        sha256:
                          type: string
                          pattern: ^[0-9a-f]{64}$
                    rows:
                      type: integer
                      minimum: 1
                    excluded:
                      type: string
                      minLength: 1
                      description: Which calibration rows were left out of the fit, and why (the rows
                        the quantiser saw, listed in the INT4 base's quantization.json).
                    target_precision:
                      type: number
                      exclusiveMinimum: 0
                      maximum: 1
                    threshold:
                      type: number
                      minimum: 0
                      maximum: 1
                    precision_at_threshold:
                      type: number
                      minimum: 0
                      maximum: 1
                    coverage_at_threshold:
                      type: number
                      minimum: 0
                      maximum: 1
              adapter_version:
                type: string
              licence:
                type: object
                additionalProperties: false
                required:
                - kind
                - adapter
                properties:
                  kind:
                    enum:
                    - open
                    - proprietary
                  adapter:
                    type: string
                    minLength: 1
    graphs_response:
      title: Jeff GET /v1/graphs response
      description: 'The decision graphs registered on the server (none of them has code nodes), callable
        through POST /v1/decide with {"graph": {"id": ...}}.'
      type: object
      additionalProperties: false
      required:
      - graphs
      properties:
        graphs:
          type: array
          items:
            $ref: '#/components/schemas/graph'
    systemone_request:
      title: Jeff POST /v1/systemone request (the legacy jeff-server API)
      description: 'One state and one or more questions about it, each answered on its own. ''model''
        names the base (''jeff'', ''jeff-latest'', ''jeff-qwen3.8-27b'' or the server''s model name) or
        a served adapter by its ID or alias. ''state'' is a string, an object or an array; with an object,
        put the fields that stay the same first and the one that changes last. ''images'': at most four
        base64 PNG, JPEG or WebP data URLs. ''orders'': 2 answers each question twice, the second time
        with its options reversed, and averages the two (twice the cost).'
      type: object
      additionalProperties: false
      required:
      - model
      - state
      - questions
      properties:
        model:
          type: string
          minLength: 1
        state:
          $ref: '#/components/schemas/systemone_request/$defs/content'
        questions:
          type: object
          minProperties: 1
          additionalProperties:
            $ref: '#/components/schemas/systemone_request/$defs/question'
        images:
          type: array
          maxItems: 4
          items:
            type: string
            maxLength: 12000000
            pattern: ^data:image/(png|jpeg|webp);base64,
        orders:
          enum:
          - 1
          - 2
      $defs:
        content:
          type:
          - string
          - object
          - array
        described:
          type:
          - string
          - object
          - array
          - 'null'
        question:
          description: 'choice: pick one of the criteria keys (each key''s value describes it, or null).
            score: a point on the criteria list, 2 to 10 levels, lowest first. noul: the probability that
            the answer is yes; criteria may describe ''true'' and ''false''.'
          type: object
          required:
          - type
          properties:
            type:
              enum:
              - choice
              - score
              - noul
          allOf:
          - if:
              required:
              - type
              properties:
                type:
                  const: choice
            then:
              additionalProperties: false
              required:
              - type
              - criteria
              properties:
                type: true
                instructions:
                  $ref: '#/components/schemas/systemone_request/$defs/described'
                criteria:
                  type: object
                  minProperties: 1
                  maxProperties: 255
                  additionalProperties:
                    $ref: '#/components/schemas/systemone_request/$defs/described'
          - if:
              required:
              - type
              properties:
                type:
                  const: score
            then:
              additionalProperties: false
              required:
              - type
              - criteria
              properties:
                type: true
                instructions:
                  $ref: '#/components/schemas/systemone_request/$defs/described'
                criteria:
                  type: array
                  minItems: 2
                  maxItems: 10
                  items:
                    $ref: '#/components/schemas/systemone_request/$defs/content'
          - if:
              required:
              - type
              properties:
                type:
                  const: noul
            then:
              additionalProperties: false
              required:
              - type
              properties:
                type: true
                instructions:
                  $ref: '#/components/schemas/systemone_request/$defs/described'
                criteria:
                  type:
                  - object
                  - 'null'
                  additionalProperties: false
                  properties:
                    'true':
                      $ref: '#/components/schemas/systemone_request/$defs/described'
                    'false':
                      $ref: '#/components/schemas/systemone_request/$defs/described'
    systemone_response:
      title: Jeff POST /v1/systemone response (the legacy jeff-server API)
      description: One answer per question, under the question's key. 'model' is the base's name for a
        request to the base, otherwise the adapter as the request named it. usage.input_tokens counts
        the prompt tokens of every pass (both orders when 'orders' is 2); output_tokens is always 0. timing.server_ms
        is the time from the request reaching the handler to the response being ready; the other timing
        fields come from the engine.
      type: object
      additionalProperties: false
      required:
      - model
      - answers
      - usage
      - timing
      properties:
        model:
          type: string
        answers:
          type: object
          additionalProperties:
            oneOf:
            - type: object
              additionalProperties: false
              required:
              - type
              - choice
              - probabilities
              - confidence
              properties:
                type:
                  const: choice
                choice:
                  type: string
                probabilities:
                  $ref: '#/components/schemas/systemone_response/$defs/probabilities'
                confidence:
                  $ref: '#/components/schemas/systemone_response/$defs/unit'
            - type: object
              additionalProperties: false
              required:
              - type
              - score
              - probabilities
              - legend
              - confidence
              properties:
                type:
                  const: score
                score:
                  type: number
                  minimum: 0
                probabilities:
                  $ref: '#/components/schemas/systemone_response/$defs/probabilities'
                legend:
                  type: object
                  additionalProperties:
                    type:
                    - string
                    - object
                    - array
                    - 'null'
                confidence:
                  $ref: '#/components/schemas/systemone_response/$defs/unit'
            - type: object
              additionalProperties: false
              required:
              - type
              - noul
              properties:
                type:
                  const: noul
                noul:
                  $ref: '#/components/schemas/systemone_response/$defs/unit'
        usage:
          type: object
          additionalProperties: false
          required:
          - input_tokens
          - output_tokens
          - orders
          properties:
            input_tokens:
              type: integer
              minimum: 0
            output_tokens:
              const: 0
            orders:
              enum:
              - 1
              - 2
        timing:
          type: object
          required:
          - server_ms
          properties:
            server_ms:
              type: number
              minimum: 0
      $defs:
        unit:
          type: number
          minimum: 0
          maximum: 1
        probabilities:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/systemone_response/$defs/unit'
    models_response:
      title: Jeff GET /v1/models response (the legacy jeff-server API)
      description: 'The model names /v1/systemone answers to: the base under the server''s model name,
        then each served adapter under its alias (its ID when it has none). release_date is the base''s
        release date (YYYY-MM-DD).'
      type: object
      additionalProperties: false
      required:
      - models
      properties:
        models:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - name
            - description
            - release_date
            properties:
              name:
                type: string
              description:
                type: string
              release_date:
                type: string
                pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
    served_request:
      title: Jeff PUT /v1/adapters/served request
      description: 'The adapters every engine should serve from now on: each engine''s whole served list
        is replaced with exactly this set (never added to it). Each entry is a catalogue adapter ID or
        alias; aliases are resolved to IDs and repeats are ignored. An empty list serves no adapters (the
        base only).'
      type: object
      additionalProperties: false
      required:
      - adapters
      properties:
        adapters:
          type: array
          items:
            type: string
            minLength: 1
    adapters_response:
      title: Jeff GET /v1/adapters response (also PUT /v1/adapters/served and POST /v1/adapters/reload)
      description: 'Every adapter in the catalogue trained for the base the engines serve (its manifest''s
        base id and version are the engines'' base: the rule an engine refuses an adapter by), marked
        served or not, with its one-line description and its functions; an adapter trained for another
        base is not listed, since no engine here can serve it, and PUT /v1/adapters/served refuses it
        as before (404 UnknownFunction). Each function''s full detail (labels, context, input, calibration)
        is in GET /v1/functions. adapters_version is an opaque change counter -- the sum of the engines''
        own counters, each counting its own served-list changes from 0 -- that goes up whenever any engine''s
        served list changes. It can go DOWN when an engine process restarts, because that engine''s own
        counter resets to 0. Compare it only to a value read earlier from the same deployment to notice
        that something changed; never use it to count how many changes happened, or compare it across
        deployments.'
      type: object
      additionalProperties: false
      required:
      - adapters
      - adapters_version
      properties:
        adapters:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - id
            - aliases
            - version
            - description
            - functions
            - served
            properties:
              id:
                type: string
                description: The adapter's catalogue ID.
              aliases:
                type: array
                items:
                  type: string
                description: 'The other names the adapter answers to, as its manifest lists them: short
                  names (triage) and, for an adapter whose ID has a version part, its unversioned ID (jeff.routing.router-open
                  for jeff.routing.router-open-v14).'
              version:
                type: string
              description:
                type: string
                minLength: 1
                description: The adapter's one-line description, as its manifest writes it (hub.summary);
                  the server refuses to load a manifest without one.
              functions:
                type: array
                description: The adapter's functions, in its manifest's order.
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - id
                  - interface
                  - calibrated
                  properties:
                    id:
                      type: string
                      description: The function's ID (adapter ID, a dot, the function's key).
                    interface:
                      type: string
                      description: The interface it implements (contract/interfaces.yaml).
                    calibrated:
                      type: boolean
                      description: 'Whether it has a threshold for the base the engines serve: its calibration
                        on a bfloat16 base, its calibration_by_format entry for the base''s format_id
                        on an INT4 base.'
              served:
                type: boolean
                description: Whether every engine in this deployment currently serves this adapter.
        adapters_version:
          type: integer
    health_response:
      title: Jeff GET /health response
      description: 'On a public server (JEFF_PUBLIC=1), a caller with no credentials gets only {"status":
        ...}; a signed-in caller, and any caller on a private server, gets the full report. status: ''ready''
        (every engine is ready and they agree on which adapters they serve), ''degraded'' (some engine
        is down or broken, but the ready ones agree and still answer requests), or ''broken'' (no engine
        is ready, or the ready ones disagree on which adapters they serve: then only requests for adapters
        every engine serves are answered, and GET /v1/adapters and adapter changes that check the served
        set fail). checkpoint, max_options and modalities describe the base model loaded by the first
        ready engine (null when no engine is ready); authentication says whether /v1 routes need credentials.'
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - status
        properties:
          status:
            $ref: '#/components/schemas/health_response/$defs/status'
      - type: object
        additionalProperties: false
        required:
        - status
        - engines
        - model
        - checkpoint
        - max_options
        - authentication
        - modalities
        properties:
          status:
            $ref: '#/components/schemas/health_response/$defs/status'
          engines:
            type: array
            items:
              $ref: '#/components/schemas/health_response/$defs/engine'
          model:
            type: string
            description: The server's JEFF_MODEL_NAME.
          checkpoint:
            type:
            - string
            - 'null'
          max_options:
            type:
            - integer
            - 'null'
          authentication:
            type: boolean
          modalities:
            type:
            - array
            - 'null'
            items:
              enum:
              - text
              - image
          cause:
            type: string
            description: 'Present when status is ''broken'': why no engine can answer.'
      $defs:
        status:
          enum:
          - ready
          - degraded
          - broken
        engine:
          type: object
          additionalProperties: false
          required:
          - socket
          - status
          - backend
          - adapters_version
          - adapters
          properties:
            socket:
              type: string
              description: The engine's socket path.
            status:
              enum:
              - ready
              - broken
              - down
              description: 'down: the API could not reach this engine''s process.'
            backend:
              type:
              - string
              - 'null'
            adapters_version:
              type:
              - integer
              - 'null'
            adapters:
              type:
              - array
              - 'null'
              items:
                type: string
            cause:
              type: string
              description: Present when status is 'broken' or 'down'.
    login_request:
      title: Jeff POST /ui/login request
      description: A console sign-in checked against the server's JEFF_UI_USERS file.
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
        password:
          type: string
    login_response:
      title: Jeff POST /ui/login response
      description: 'A console session token: send it as Authorization: Bearer <token> in place of the
        API key.'
      type: object
      additionalProperties: false
      required:
      - user
      - token
      properties:
        user:
          type: string
          description: The signed-in login, lower-cased.
        token:
          type: string
    DecideCallsRequest:
      title: DecideCallsRequest
      description: Up to 256 function calls, answered in order.
      type: object
      additionalProperties: false
      required:
      - calls
      properties:
        calls:
          type: array
          minItems: 1
          maxItems: 256
          items:
            $ref: '#/components/schemas/decide_request/$defs/call'
        on_low_confidence:
          $ref: '#/components/schemas/decide_request/$defs/policy'
    DecideDispatchRequest:
      title: DecideDispatchRequest
      description: One input routed through router functions to the function that should answer it.
      type: object
      additionalProperties: false
      required:
      - dispatch
      properties:
        dispatch:
          $ref: '#/components/schemas/decide_request/$defs/dispatch'
        on_low_confidence:
          $ref: '#/components/schemas/decide_request/$defs/policy'
    DecideGraphRequest:
      title: DecideGraphRequest
      description: A registered graph (by id) or an inline graph without code nodes and with at most 256
        nodes.
      type: object
      additionalProperties: false
      required:
      - graph
      - input
      - params
      properties:
        graph:
          $ref: '#/components/schemas/decide_request/$defs/graph'
        input: true
        params:
          type: object
        on_low_confidence_by_node:
          type: object
          maxProperties: 256
          additionalProperties:
            $ref: '#/components/schemas/decide_request/$defs/policy'
    HealthStatusOnly:
      title: HealthStatusOnly
      description: What a public server (JEFF_PUBLIC=1) answers a caller sending no credentials at all.
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          $ref: '#/components/schemas/health_response/$defs/status'
    HealthReport:
      title: HealthReport
      description: What a signed-in caller gets, and what any caller gets on a private server.
      type: object
      additionalProperties: false
      required:
      - status
      - engines
      - model
      - checkpoint
      - max_options
      - authentication
      - modalities
      properties:
        status:
          $ref: '#/components/schemas/health_response/$defs/status'
        engines:
          type: array
          items:
            $ref: '#/components/schemas/health_response/$defs/engine'
        model:
          type: string
          description: The server's JEFF_MODEL_NAME.
        checkpoint:
          type:
          - string
          - 'null'
        max_options:
          type:
          - integer
          - 'null'
        authentication:
          type: boolean
        modalities:
          type:
          - array
          - 'null'
          items:
            enum:
            - text
            - image
        cause:
          type: string
          description: 'Present when status is ''broken'': why no engine can answer.'
    LegacyModelErrorDetail:
      title: LegacyModelErrorDetail
      description: jeff-server's Pydantic-style problem location for the request body's model field.
      type: array
      minItems: 1
      items:
        type: object
        additionalProperties: false
        required:
        - loc
        - msg
        - type
        properties:
          loc:
            type: array
            items:
              type: string
          msg:
            type: string
          type:
            const: value_error
    ConsoleMeResponse:
      title: ConsoleMeResponse
      description: The signed-in caller's identity (jeff_server.console.me).
      type: object
      additionalProperties: false
      required:
      - user
      - kind
      - admin
      properties:
        user:
          type: string
          description: 'The caller''s subject: a login (kind "console"), "api-key" (kind "api-key"), a
            hub token''s sub (kind "hub"), or "anonymous" when this server has no credentials configured
            at all (kind "open").'
        kind:
          type: string
          enum:
          - api-key
          - console
          - hub
          - open
        admin:
          type: boolean
          description: Whether this is a console session signed in under a login JEFF_ADMINS lists; always
            false for "api-key", "hub" and "open" -- admin status is a console-session question only.
    ConsoleEventRequest:
      title: ConsoleEventRequest
      type: object
      additionalProperties: false
      required:
      - view
      properties:
        view:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[a-z0-9-]+$
    ConsoleEventResponse:
      title: ConsoleEventResponse
      type: object
      additionalProperties: false
      required:
      - logged
      properties:
        logged:
          type: boolean
          description: 'false when JEFF_ACCESS_LOG is not set: nothing was written.'
    ConsoleExample:
      title: ConsoleExample
      type: object
      additionalProperties: false
      required:
      - name
      - call
      properties:
        name:
          type: string
        call:
          type: object
          description: A decide_request call.
        expected:
          type:
          - string
          - boolean
          - number
          description: The test set's answer, for an example taken from an adapter's test set (its folder's
            playground-examples.json); absent for a golden case.
    ConsoleExamplesResponse:
      title: ConsoleExamplesResponse
      description: contract/golden/step1.json's cases, then the examples in each served adapter folder's
        playground-examples.json, for functions this server serves now (jeff_server.console).
      type: object
      additionalProperties: false
      required:
      - examples
      properties:
        examples:
          type: array
          items:
            $ref: '#/components/schemas/ConsoleExample'
    ConsoleAccessLogResponse:
      title: ConsoleAccessLogResponse
      description: jeff_server.access_log.AccessLog.read()'s report.
      type: object
      additionalProperties: false
      required:
      - entries
      - total
      - people
      - anonymous_visits
      - anonymous_ips
      - locations_on
      properties:
        entries:
          type: array
          items:
            type: object
          description: Newest first, at most `limit`.
        total:
          type: integer
          description: Every entry ever recorded, not just the ones returned.
        people:
          type: array
          items:
            type: object
          description: One summary per signed-in login.
        anonymous_visits:
          type: integer
        anonymous_ips:
          type: array
          items:
            type: string
        locations_on:
          type: boolean
          description: Whether JEFF_GEOIP_DB is configured.
    ErrorBody:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - type
          - message
          - details
          properties:
            type:
              type: string
              description: The JeffError subclass name, e.g. NotLicensed.
            message:
              type: string
            details:
              type: object
              description: The error's own extra attributes, if it has any (for example NotInstalled's
                function_id); empty for most errors.
    LegacyErrorBody:
      type: object
      additionalProperties: false
      required:
      - error
      - detail
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - type
          - message
          - details
          properties:
            type:
              type: string
              description: The JeffError subclass name, e.g. NotLicensed.
            message:
              type: string
            details:
              type: object
              description: The error's own extra attributes, if it has any (for example NotInstalled's
                function_id); empty for most errors.
        detail:
          description: A problem with the model as LegacyModelErrorDetail, anything else as a plain string
            (jeff_server.systemone.legacy_detail). No discriminator property is added -- the wire has
            none -- so tell them apart by JSON type (array vs string).
          oneOf:
          - type: string
          - $ref: '#/components/schemas/LegacyModelErrorDetail'
