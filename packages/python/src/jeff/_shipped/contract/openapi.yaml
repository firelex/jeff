  /v1/adapters/reload:
    post:
      summary: Make every engine re-read its served file from disk.
      description: 'Each engine reads the served file only it can read and scans its adapter folders again;
        a router left without one of its targets afterwards is reported as 424 NotInstalled, saying the
        engines have already changed. The server''s catalogue (JEFF_CATALOGUE plus the adapter folders
        under JEFF_ADAPTER_DIRS) is built first, so an invalid adapter folder is 500 ManifestError with
        no engine changed; after the reload the server answers from the rebuilt catalogue at once. Owner-only:
        needs the server''s own credentials (the API key or a console session token from POST /ui/login),
        never a hub-signed token, which belongs to a customer and is refused with 403 NotLicensed. With
        no credentials configured on the server, every caller is the owner. Refused as 422 InvalidRequest
        on a public server.'
      responses:
        '200':
          description: The adapters after the reload.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
