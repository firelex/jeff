  /ui/login:
    post:
      summary: Sign in for a console session token.
      description: Checks an email and password against the server's JEFF_UI_USERS file and returns a
        session token, which the API then accepts in place of the API key (as an owner). 401 Unauthorised
        when sign-in is not configured (JEFF_UI_USERS unset) or the credentials are wrong; repeated wrong
        attempts answer 429 RateLimited with Retry-After instead (its own lockout, separate from the per-caller
        limiter every /v1 route has). Never needs a bearer token itself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/login_request'
      responses:
        '200':
          description: Signed in.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/login_response'
        '401':
