  /v1/adapters:
    get:
      summary: List every catalogue adapter trained for the served base, and whether it is served.
      description: 'Only the adapters trained for the base the engines serve are listed (an adapter for
        another base can never be served here, and PUT /v1/adapters/served refuses it with 404 UnknownFunction),
        each with its one-line description and its functions (ID, interface, and whether it has a threshold
        for the served base); GET /v1/functions has each function''s full detail. 500 EngineError while
        any engine is down, or while the engines serve different adapters (or different bases): this endpoint
        reports one served list for the whole deployment, which does not exist then -- GET /health reports
        each engine instead. See adapters_response''s own description for what adapters_version means.'
      responses:
        '200':
          description: The catalogue's adapters for the served base, each marked served or not.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
