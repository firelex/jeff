  /metrics:
    get:
      summary: Prometheus metrics for this deployment.
      description: 'Per engine: whether the API reached it, and its scheduler''s counters (queue, batches,
        rows, busy, deadlines, model time per batch). Per route: HTTP responses by status. Owner-only:
        needs the server''s own credentials (the API key or a console session token from POST /ui/login),
        never a hub-signed token, which belongs to a customer and is refused with 403 NotLicensed. With
        no credentials configured on the server, every caller is the owner.'
      responses:
        '200':
          description: Prometheus text format, exactly as sent.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
          content:
            text/plain; version=0.0.4; charset=utf-8:
              schema:
                type: string
        '401':
          description: HTTP 401; see contract/errors.yaml for which error type(s) answer with this status.
