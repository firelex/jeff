openapi: 3.1.0
info:
  title: Jeff HTTP API
  version: 1.0.0
  description: 'The HTTP API in front of Jeff''s engine processes (apps/server, package jeff-server):
    POST /v1/decide, GET /v1/functions and GET /v1/graphs run the in-process SDK''s planner over the server''s
    catalogue and engines; GET /v1/adapters, PUT /v1/adapters/served, POST /v1/adapters/reload, GET /health
    and GET /metrics operate the deployment; POST /v1/systemone and GET /v1/models are jeff-server''s
    own API, kept for its existing clients; POST /ui/login signs in for a console session, and GET /ui/me,
    POST /ui/events, GET /ui/access-log and GET /ui/examples serve the console itself (apps/server/src/jeff_server/console.py),
    behind the same credentials and rate limit as /v1; /v1/factory/* is the adapter factory (owner-only),
    whose build steps the API queues for a separate factory worker process. The console''s page and its
    static assets -- GET /ui, GET /ui/, GET /ui/assets/{name}, and GET / (which redirects to /ui/ on a
    public server) -- are not listed under paths: they need no credentials at all (the page signs itself
    in) and serve HTML and files, not JSON operations this document describes. Every error response has
    the body {"error": {"type", "message", "details"}} (ErrorBody), or additionally "detail" (LegacyErrorBody)
    on the two legacy routes. Every response, success or error, carries an x-request-id header (components.headers.XRequestId).
    The low-latency channel, a WebSocket at /v1/channel, is not an HTTP operation and is not listed under
    paths: each binary WebSocket message carries one frame of the engine socket''s format (a 4-byte big-endian
    length, then a msgpack map); the client authenticates once with an auth frame, binds functions to
    handles and then sends only each call''s input. Its operations, limits and errors are described in
    contract/socket.md ("The channel") and contract/schemas/socket.schema.json. The MCP (Model Context
    Protocol) endpoint, /mcp, is not listed under paths either: it is MCP''s streamable HTTP transport
    (JSON-RPC messages in POST bodies, answered as JSON), offering one tool per function the server can
    call now plus jeff_dispatch and jeff_list_functions, behind the same bearer credentials as /v1 (401
    Unauthorised without them) and the same rate limit (each HTTP request to /mcp is one request; 429
    RateLimited over it); a refused tool call is a tool error whose text starts with the error type, e.g.
    "NotLicensed: ...".'
paths:
  /v1/decide:
    post:
      summary: 'Run the planner: calls, a dispatch, or a graph.'
      description: Exactly one of three request shapes; see DecideCallsRequest, DecideDispatchRequest
        and DecideGraphRequest. Every call's function (for 'calls'; for 'dispatch', the leaf a router
        reaches; for 'graph', each node's function) is checked against the caller's licences before it
        is decided (403 NotLicensed), and against on_low_confidence's own escalation steps first. on_low_confidence='error'
        answers 409 LowConfidence carrying the abstained decision; escalation runs through function references
        only -- an LLM, a person or another server step runs in the SDK, not here, and is refused as 422
        InvalidRequest.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: 'Told apart by which key is present -- calls, dispatch or graph. No discriminator
                property is added: the wire has none.'
              oneOf:
              - $ref: '#/components/schemas/DecideCallsRequest'
              - $ref: '#/components/schemas/DecideDispatchRequest'
              - $ref: '#/components/schemas/DecideGraphRequest'
      responses:
        '200':
          description: One reply per request shape.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/decide_response'
        '401':
          description: HTTP 401; see contract/errors.yaml for which error type(s) answer with this status.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            WWW-Authenticate:
              description: Bearer, unless the 401 is for console sign-in itself, which no bearer token
                would fix.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '402':
          description: HTTP 402; see contract/errors.yaml for which error type(s) answer with this status.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: HTTP 403; see contract/errors.yaml for which error type(s) answer with this status.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: HTTP 404; see contract/errors.yaml for which error type(s) answer with this status.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: HTTP 409; see contract/errors.yaml for which error type(s) answer with this status.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: HTTP 422; see contract/errors.yaml for which error type(s) answer with this status.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '424':
          description: HTTP 424; see contract/errors.yaml for which error type(s) answer with this status.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '429':
          description: HTTP 429; see contract/errors.yaml for which error type(s) answer with this status.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            Retry-After:
              description: Whole seconds to wait before retrying.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: HTTP 500; see contract/errors.yaml for which error type(s) answer with this status.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '502':
          description: HTTP 502; see contract/errors.yaml for which error type(s) answer with this status.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '504':
          description: HTTP 504; see contract/errors.yaml for which error type(s) answer with this status.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '529':
          description: HTTP 529; see contract/errors.yaml for which error type(s) answer with this status.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            Retry-After:
              description: Whole seconds to wait before retrying.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      security:
      - bearerAuth: []
      - {}
  /v1/functions:
    get:
      summary: List every callable function.
      description: 'Every function of every adapter the server''s engine currently serves and that has
        a manifest in the server''s catalogue (an adapter the engine serves without a manifest is not
        listed: without it, nothing can call it).'
      responses:
        '200':
          description: The functions this server can decide.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
