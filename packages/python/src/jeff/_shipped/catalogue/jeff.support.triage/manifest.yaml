id: jeff.support.triage
version: 1.4.0
aliases:
- triage
licence:
  kind: open
  adapter: Apache-2.0
weights:
  open:
    repo: mstrasser/jeff-adapter-triage
    revision: v1.4
base:
  id: jeff-base
  version: v1.4
  max_options: 39
context:
- key: company
  description: One sentence about the organisation the message is sent to.
  required: true
- key: channel
  description: Where the message came from, for example email, web form, chat, app review, social media reply or phone transcript.
  required: true
input:
  key: message
  description: The ticket or email as received, including subject line, quoted thread and signature.
  form: fields
functions:
  route:
    interface: route
    type: choice
    instructions: Which team should handle this message? If it covers several issues, choose the team for the most important
      one.
    labels:
      source: caller
      fixed_first:
        other: Not for any of these teams
      caller_keys: k{n}
      max: 35
    abstain_labels: []
    calibration:
      data: hf://mstrasser/jeff-adapter-triage@v1.4/calibration.jsonl
      rows: 367
      target_precision: 0.95
      threshold: 0.43479
      precision_at_threshold: 0.950954
      coverage_at_threshold: 1.0
  urgency:
    interface: rate
    type: score
    instructions: How urgently does this need a response?
    labels:
      source: fixed
      levels:
      - No action needed
      - Can wait a few days
      - Handle within a day
      - Handle within hours
      - Handle immediately
    abstain_labels: []
    calibration:
      data: hf://mstrasser/jeff-adapter-triage@v1.4/calibration.jsonl
      rows: 367
      target_precision: 0.95
      threshold: 0.787201
      precision_at_threshold: 0.95
      coverage_at_threshold: 0.599455
  sentiment:
    interface: rate
    type: score
    instructions: How does the customer feel?
    labels:
      source: fixed
      levels:
      - Very negative, angry or distressed
      - Negative
      - Neutral
      - Positive
      - Very positive
    abstain_labels: []
    calibration:
      data: hf://mstrasser/jeff-adapter-triage@v1.4/calibration.jsonl
      rows: 367
      target_precision: 0.95
      threshold: 0.686658
      precision_at_threshold: 0.950464
      coverage_at_threshold: 0.880109
  needs_human:
    interface: requires_escalation
    type: noul
    instructions: Does this need a person to act on it now, rather than an automatic reply? Answer yes for complaints that
      could escalate, legal or safety issues, or requests an automatic system cannot resolve.
    labels:
      source: fixed
    abstain_labels: []
    calibration:
      data: hf://mstrasser/jeff-adapter-triage@v1.4/calibration.jsonl
      rows: 367
      target_precision: 0.95
      threshold: 0.543562
      precision_at_threshold: 0.989101
      coverage_at_threshold: 1.0
routes_to: []
tests:
  published: hf://mstrasser/jeff-adapter-triage@v1.4/test.jsonl
  calibration: hf://mstrasser/jeff-adapter-triage@v1.4/calibration.jsonl
  function_by: id_suffix
hub:
  title: Support ticket triage
  summary: Routes a support ticket or email to a team and scores its urgency, sentiment and need for a person.
  task: support
  kind: official
  maintainer:
    name: Jeff maintainers
    github: firelex
