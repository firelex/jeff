adapter_path: oss-query-route
id: jeff.retrieval.query-route
aliases: [oss-query-route, query-route]
version: 1.4.0
function_by: only
context:
  - key: menu
    description: "The sources a query can be sent to (document collections, indexes, databases, tools), written as tool definitions with names and descriptions."
input:
