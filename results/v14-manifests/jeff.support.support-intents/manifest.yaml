id: jeff.support.support-intents
version: 1.4.0
aliases:
- support-intents
licence:
  kind: open
  adapter: Apache-2.0
weights:
  local: {}
base:
  id: jeff-base
  version: v1.4
  max_options: 64
context:
- key: service
  description: One short phrase about the service the message is sent to. Training used three, one per data set, for example
    "Customer support chat of an online shop".
  required: true
input:
  key: message
  description: The customer's or user's message as received.
  form: fields
functions:
  intent:
    interface: classify
    type: choice
    instructions: What does the customer want? Choose the request that best matches what the customer is asking for in their
      message.
    labels:
      source: caller
      fixed_first: {}
      caller_keys: null
      max: 64
    abstain_labels: []
    calibration:
      data: hf://datasets/teamsuzie/jeff-data@main/apps/support-intents/calibration.jsonl
      data_mirror:
        path: /mnt/d/jeff-data/apps/support-intents/calibration.jsonl
        sha256: bb5d24665f9edab2e5d6093ed083e2756a7ee3a1875c29e994b24822a7d66a91
      rows: 999
      target_precision: 0.95
      threshold: 0.290397
      precision_at_threshold: 0.964965
      coverage_at_threshold: 1.0
routes_to: []
tests:
  published: null
  calibration: null
  internal: hf://datasets/teamsuzie/jeff-data@main/apps/support-intents/test.jsonl
  internal_calibration: hf://datasets/teamsuzie/jeff-data@main/apps/support-intents/calibration.jsonl
  function_by: only
hub:
  title: support-intents
  summary: Jeff v1.4 adapter `support-intents`. Names what a customer or assistant user is asking for, from a fixed list of
    requests such as cancel_order or track_refund.
  source: local adapter folder support-intents (not on Hugging Face)
  notes:
  - 'intent: instructions are the one text of the 3915 test rows marked canonical (source.instructions); the other 1662 ask
    the same question reworded or with no instructions (as trained), and are rebuilt with the canonical text in template mode.'
  - 'intent: max 64 is the largest number of caller labels in the test rows (nothing documents a training limit).'
  - 'base: jeff-base v1.4, identified by the SHA-256 of its model.safetensors, which the adapter''s decision_config.json records
    for its base checkpoint.'
  - 'tests: the test set is the private hf://datasets/teamsuzie/jeff-data@main/apps/support-intents/test.jsonl, so tests.published
    is null; the calibration of each function is filled in later by `jeff calibrate`.'
