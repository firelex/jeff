id: jeff.retrieval.doc-type
version: 1.4.0
aliases:
- oss-doc-type
- doc-type
licence:
  kind: open
  adapter: Apache-2.0
weights:
  local: {}
base:
  id: jeff-base
  version: v1.4
  max_options: 11
context:
- key: sorting_desk
  description: 'Where the document arrived: a sentence describing the inbox or team that sorts it.'
  required: true
input:
  key: document
  description: The document's text.
  form: fields
functions:
  doc_type:
    interface: classify
    type: choice
    instructions: 'Which type of document is this? Choose one type from the list, using the descriptions. Judge by what the
      document is and does (its purpose, who sends it to whom, what it asks for or records), not by words it mentions in passing:
      a quote that says an invoice will follow is still a quote. The title may be missing or worded differently from the type
      names. When two listed types are similar, the descriptions say how to tell them apart. other: the document is none of
      the listed types, even when a listed type is similar to it.'
    labels:
      source: caller
      fixed_first: {}
      caller_keys: null
      max: 11
    abstain_labels: []
    calibration:
      data: hf://datasets/teamsuzie/jeff-data@main/apps/oss-doc-type/calibration.jsonl
      data_mirror:
        path: /mnt/d/jeff-data/apps/oss-doc-type/calibration.jsonl
        sha256: d164f3753b75a78a1cff1cdf61f1f9b7a6f884d9da59039d48695ed8ab7c736b
      rows: 2000
      target_precision: 0.95
      threshold: 0.497832
      precision_at_threshold: 0.978
      coverage_at_threshold: 1.0
routes_to: []
tests:
  published: null
  calibration: null
  internal: hf://datasets/teamsuzie/jeff-data@main/apps/oss-doc-type/test.jsonl
  internal_calibration: hf://datasets/teamsuzie/jeff-data@main/apps/oss-doc-type/calibration.jsonl
  function_by: only
hub:
  title: oss-doc-type
  summary: Jeff v1.4 adapter `doc-type`. Sorts a document into one of the types on a list (each with a description), or other.
  source: local adapter folder oss-doc-type (not on Hugging Face)
  notes:
  - 'doc_type: instructions are the one text of the 1395 test rows marked canonical (source.instructions); the other 605 ask
    the same question reworded or with no instructions (as trained), and are rebuilt with the canonical text in template mode.'
  - 'doc_type: max 7 is the largest number of caller labels in the test rows (nothing documents a training limit).'
  - 'doc_type: the calibration rows offer up to 11 caller labels, more than the test rows'' 7, so max is 11.'
  - 'base: jeff-base v1.4, identified by the SHA-256 of its model.safetensors, which the adapter''s decision_config.json records
    for its base checkpoint.'
  - 'tests: the test set is the private hf://datasets/teamsuzie/jeff-data@main/apps/oss-doc-type/test.jsonl, so tests.published
    is null; the calibration of each function is filled in later by `jeff calibrate`.'
