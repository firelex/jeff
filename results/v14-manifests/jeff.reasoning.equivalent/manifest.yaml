id: jeff.reasoning.equivalent
version: 1.4.0
aliases:
- oss-equivalent
- equivalent
licence:
  kind: open
  adapter: Apache-2.0
weights:
  local: {}
base:
  id: jeff-base
  version: v1.4
  max_options: 3
context:
- key: setting
  description: 'Who is asking: a sentence naming the team and organisation.'
  required: true
- key: scope
  description: 'What counts when comparing: a sentence saying which details matter (for example every fact, number, date and
    name).'
  required: true
- key: item_a
  description: 'The first item: a text (a rule, sentence, record or value).'
  required: true
input:
  key: item_b
  description: The second item, to compare with item_a within the scope.
  form: fields
functions:
  equivalent:
    interface: classify
    type: choice
    instructions: Do these two items mean the same thing, within the stated scope? Answer yes when every detail that matters
      under the scope is the same, even if the wording, the order of things whose order does not matter, the units or the
      formats differ. Answer no when at least one detail that matters differs, or is in one item but not the other. Answer
      unclear only when sameness depends on something neither item settles, such as a date or a time of day that can be read
      two ways, or a number given without the unit or sign that decides what it means.
    labels:
      source: fixed
      fixed:
        'no': 'No: they differ in a detail that matters.'
        unclear: 'Unclear: sameness depends on something neither item settles.'
        'yes': 'Yes: they mean the same within the scope.'
      subset: false
    abstain_labels: []
    calibration:
      data: hf://datasets/teamsuzie/jeff-data@main/apps/oss-equivalent/calibration.jsonl
      data_mirror:
        path: /mnt/d/jeff-data/apps/oss-equivalent/calibration.jsonl
        sha256: e86e74c24b5e39ff37a727334ee9cec6d620ae88750a890b06af8ab19ec57c16
      rows: 2000
      target_precision: 0.98
      threshold: 0.499003
      precision_at_threshold: 0.984
      coverage_at_threshold: 1.0
routes_to: []
tests:
  published: null
  calibration: null
  internal: hf://datasets/teamsuzie/jeff-data@main/apps/oss-equivalent/test.jsonl
  internal_calibration: hf://datasets/teamsuzie/jeff-data@main/apps/oss-equivalent/calibration.jsonl
  function_by: only
hub:
  title: oss-equivalent
  summary: 'Jeff v1.4 adapter `equivalent`. Checks whether two items mean the same thing within a stated scope, allowing for
    other wording, units and formats: yes, no or unclear.'
  source: local adapter folder oss-equivalent (not on Hugging Face)
  notes:
  - 'equivalent: instructions are the one text of the 1401 test rows marked canonical (source.instructions); the other 599
    ask the same question reworded or with no instructions (as trained), and are rebuilt with the canonical text in template
    mode.'
  - 'equivalent: every test row has the same 3 labels in varying orders (training shuffled them), so they are listed by key.'
  - 'base: jeff-base v1.4, identified by the SHA-256 of its model.safetensors, which the adapter''s decision_config.json records
    for its base checkpoint.'
  - 'tests: the test set is the private hf://datasets/teamsuzie/jeff-data@main/apps/oss-equivalent/test.jsonl, so tests.published
    is null; the calibration of each function is filled in later by `jeff calibrate`.'
