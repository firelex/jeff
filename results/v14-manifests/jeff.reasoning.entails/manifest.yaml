id: jeff.reasoning.entails
version: 1.4.0
aliases:
- oss-entails
- entails
licence:
  kind: open
  adapter: Apache-2.0
weights:
  local: {}
base:
  id: jeff-base
  version: v1.4
  max_options: 3
context:
- key: setting
  description: 'Who is asking: a sentence naming the team and organisation the evidence comes from.'
  required: true
- key: evidence
  description: 'The evidence: a list of documents, messages or records, each with `source` and `text`.'
  required: true
input:
  key: claim
  description: The claim to check against the evidence, one sentence.
  form: fields
functions:
  entails:
    interface: classify
    type: choice
    instructions: 'Does the evidence support the claim? Answer supported when the evidence, read plainly, establishes the
      claim, including what follows from it by simple arithmetic, by comparing dates or by combining two pieces of evidence.
      Answer unsupported when the evidence contradicts the claim or does not contain what the claim needs. Answer unclear
      only when the evidence speaks to the claim but leaves it genuinely open: for example a range or vague date that could
      go either way, sources that disagree with no sign of which is right, a cause that is only suspected or implied, or a
      person or record the evidence leaves ambiguous.'
    labels:
      source: fixed
      fixed:
        supported: 'Supported: the evidence establishes the claim.'
        unclear: 'Unclear: the evidence bears on the claim but leaves it genuinely open.'
        unsupported: 'Unsupported: the evidence contradicts the claim or does not say what it needs.'
      subset: false
    abstain_labels: []
    calibration:
      data: hf://datasets/teamsuzie/jeff-data@main/apps/oss-entails/calibration.jsonl
      data_mirror:
        path: /mnt/d/jeff-data/apps/oss-entails/calibration.jsonl
        sha256: fa44aafe7653f2f7aa53fdaa31cf4df4bb0133b5c902978c6b4006b51c9193a3
      rows: 2000
      target_precision: 0.98
      threshold: 0.517779
      precision_at_threshold: 0.9845
      coverage_at_threshold: 1.0
routes_to: []
tests:
  published: null
  calibration: null
  internal: hf://datasets/teamsuzie/jeff-data@main/apps/oss-entails/test.jsonl
  internal_calibration: hf://datasets/teamsuzie/jeff-data@main/apps/oss-entails/calibration.jsonl
  function_by: only
hub:
  title: oss-entails
  summary: 'Jeff v1.4 adapter `entails`. Checks whether the evidence given (documents, messages or records) supports a claim:
    supported, unsupported or unclear.'
  source: local adapter folder oss-entails (not on Hugging Face)
  notes:
  - 'entails: instructions are the one text of the 1412 test rows marked canonical (source.instructions); the other 588 ask
    the same question reworded or with no instructions (as trained), and are rebuilt with the canonical text in template mode.'
  - 'entails: every test row has the same 3 labels in varying orders (training shuffled them), so they are listed by key.'
  - 'base: jeff-base v1.4, identified by the SHA-256 of its model.safetensors, which the adapter''s decision_config.json records
    for its base checkpoint.'
  - 'tests: the test set is the private hf://datasets/teamsuzie/jeff-data@main/apps/oss-entails/test.jsonl, so tests.published
    is null; the calibration of each function is filled in later by `jeff calibrate`.'
