id: jeff.agents.assistant-routing
version: 1.4.0
aliases:
- assistant-routing
licence:
  kind: open
  adapter: Apache-2.0
weights:
  local: {}
base:
  id: jeff-base
  version: v1.4
  max_options: 2
context:
- key: accounts
  description: The user's accounts the assistant can act on, as one text (for example "Work account [work], Personal account
    [personal]").
  required: true
- key: date_and_time_zone
  description: Today's date and time and the user's time zone, as one sentence.
  required: true
- key: conversation
  description: The conversation so far as one text, including the user's messages and the tool calls and results.
  required: true
input:
  key: turn
  description: What the main assistant must do next in this turn (for example "Reply to the user in words.").
  form: fields
functions:
  needs_thinking:
    interface: detect
    type: noul
    instructions: Does the main assistant need to think carefully before writing this turn, rather than answering straight
      away?
    labels:
      source: fixed
    abstain_labels: []
    calibration:
      data: hf://datasets/teamsuzie/jeff-data@main/apps/assistant-routing/calibration.jsonl
      data_mirror:
        path: /mnt/d/jeff-data/apps/assistant-routing/calibration.jsonl
        sha256: 5dddf0123699fb0ba556e50311358ad24a4f6c3a492584e7fa1a8d9c41dcc44e
      rows: 341
      target_precision: 0.95
      threshold: 0.881711
      precision_at_threshold: 0.951872
      coverage_at_threshold: 0.548387
routes_to: []
tests:
  published: null
  calibration: null
  internal: hf://datasets/teamsuzie/jeff-data@main/apps/assistant-routing/test.jsonl
  internal_calibration: hf://datasets/teamsuzie/jeff-data@main/apps/assistant-routing/calibration.jsonl
  function_by: only
hub:
  title: assistant-routing
  summary: Jeff v1.4 adapter `assistant-routing`. For the turns a Jeff-routed assistant hands to the large model, predicts
    whether the turn needs careful thinking or can be answered straight away, so easy turns go to a cheaper path.
  source: local adapter folder assistant-routing (not on Hugging Face)
  notes:
  - 'needs_thinking: instructions are the one text of the 541 test rows marked canonical (source.instructions); the other
    230 ask the same question reworded or with no instructions (as trained), and are rebuilt with the canonical text in template
    mode.'
  - 'base: jeff-base v1.4, identified by the SHA-256 of its model.safetensors, which the adapter''s decision_config.json records
    for its base checkpoint.'
  - 'tests: the test set is the private hf://datasets/teamsuzie/jeff-data@main/apps/assistant-routing/test.jsonl, so tests.published
    is null; the calibration of each function is filled in later by `jeff calibrate`.'
