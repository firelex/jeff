id: jeff.retrieval.section-id
version: 1.4.0
aliases:
- oss-section-id
- section-id
licence:
  kind: open
  adapter: Apache-2.0
weights:
  local: {}
base:
  id: jeff-base
  version: v1.4
  max_options: 12
context:
- key: document
  description: 'What the document is: its kind and parties, one line.'
  required: true
input:
  key: passage
  description: The passage's text.
  form: fields
functions:
  section:
    interface: classify
    type: choice
    instructions: 'Which section of the document is this passage from? Choose the section kind whose main purpose the passage
      serves, using the descriptions. Judge by its content, not by topics it mentions in passing: a termination clause that
      mentions unpaid fees is still about termination. Headings may be missing, numbered or worded differently from the section
      names. none: the passage serves none of the listed section kinds (for example a kind of section that is not on the list),
      even when a listed kind is similar.'
    labels:
      source: caller
      fixed_first: {}
      caller_keys: null
      max: 11
    abstain_labels: []
    calibration:
      data: hf://datasets/teamsuzie/jeff-data@main/apps/oss-section-id/calibration.jsonl
      data_mirror:
        path: /mnt/d/jeff-data/apps/oss-section-id/calibration.jsonl
        sha256: 8453fdcd365314608800b372cd330a0449f94240d95d5a7d9de2bda38ee6e053
      rows: 2000
      target_precision: 0.95
      threshold: 0.533367
      precision_at_threshold: 0.9975
      coverage_at_threshold: 1.0
routes_to: []
tests:
  published: null
  calibration: null
  internal: hf://datasets/teamsuzie/jeff-data@main/apps/oss-section-id/test.jsonl
  internal_calibration: hf://datasets/teamsuzie/jeff-data@main/apps/oss-section-id/calibration.jsonl
  function_by: only
hub:
  title: oss-section-id
  summary: Jeff v1.4 adapter `section-id`. Says which section of a document a passage comes from, from a list of section kinds
    with descriptions, or none.
  source: local adapter folder oss-section-id (not on Hugging Face)
  notes:
  - 'section: instructions are the one text of the 1372 test rows marked canonical (source.instructions); the other 628 ask
    the same question reworded or with no instructions (as trained), and are rebuilt with the canonical text in template mode.'
  - 'section: max 11 is the largest number of caller labels in the test rows (nothing documents a training limit).'
  - 'base: jeff-base v1.4, identified by the SHA-256 of its model.safetensors, which the adapter''s decision_config.json records
    for its base checkpoint.'
  - 'tests: the test set is the private hf://datasets/teamsuzie/jeff-data@main/apps/oss-section-id/test.jsonl, so tests.published
    is null; the calibration of each function is filled in later by `jeff calibrate`.'
