id: jeff.agents.tool-route
version: 1.4.0
aliases:
- oss-tool-route
- tool-route
licence:
  kind: open
  adapter: Apache-2.0
weights:
  local: {}
base:
  id: jeff-base
  version: v1.4
  max_options: 26
context:
- key: app
  description: 'The application the agent works in: its name and a description of what it does and for whom.'
  required: true
- key: today
  description: Today's date, written out (for example 'Wednesday 23 June 2027').
  required: true
- key: tools
  description: The tool menu, in any common format (Python signatures, JSON schemas and so on).
  required: true
- key: conversation
  description: The conversation so far, a list of messages (user, assistant, tool calls and tool results).
  required: true
input:
  key: request
  description: The user's latest message.
  form: fields
functions:
  tool:
    interface: route
    type: choice
    instructions: 'What should the agent do next with the user''s latest message? Choose the tool on the menu that should
      be called now when that tool can do what the user asks and the request and the conversation give every detail it requires
      (details the agent can take from earlier in the conversation count). Choose none when no tool is needed or none fits:
      the user is chatting or thanking, asks something the conversation already answers, or asks for something no tool on
      the menu can do. Choose ask_user when a tool fits but a required detail is missing and cannot be taken from the conversation,
      or when the request could mean two different records or actions and the agent must ask which. Read the tool names and
      descriptions carefully: similar tools do different things.'
    labels:
      source: caller
      fixed_first: {}
      caller_keys: null
      max: 24
    abstain_labels: []
    calibration:
      data: hf://datasets/teamsuzie/jeff-data@main/apps/oss-tool-route/calibration.jsonl
      data_mirror:
        path: /mnt/d/jeff-data/apps/oss-tool-route/calibration.jsonl
        sha256: 8dd064fa51355657097e11c61a3e77534f874449ceb4b1924cdabd99c3362f68
      rows: 2000
      target_precision: 0.95
      threshold: 0.413434
      precision_at_threshold: 0.985
      coverage_at_threshold: 1.0
routes_to: []
tests:
  published: null
  calibration: null
  internal: hf://datasets/teamsuzie/jeff-data@main/apps/oss-tool-route/test.jsonl
  internal_calibration: hf://datasets/teamsuzie/jeff-data@main/apps/oss-tool-route/calibration.jsonl
  function_by: only
hub:
  title: oss-tool-route
  summary: Jeff v1.4 adapter `tool-route`. Given a tool menu written into the request (in any common format) and the conversation,
    picks the tool to call next, no tool, or asking the user for a missing detail.
  source: local adapter folder oss-tool-route (not on Hugging Face)
  notes:
  - 'tool: instructions are the one text of the 1384 test rows marked canonical (source.instructions); the other 616 ask the
    same question reworded or with no instructions (as trained), and are rebuilt with the canonical text in template mode.'
  - 'tool: max 23 is the largest number of caller labels in the test rows (nothing documents a training limit).'
  - 'tool: the calibration rows offer up to 24 caller labels, more than the test rows'' 23, so max is 24.'
  - 'base: jeff-base v1.4, identified by the SHA-256 of its model.safetensors, which the adapter''s decision_config.json records
    for its base checkpoint.'
  - 'tests: the test set is the private hf://datasets/teamsuzie/jeff-data@main/apps/oss-tool-route/test.jsonl, so tests.published
    is null; the calibration of each function is filled in later by `jeff calibrate`.'
