id: jeff.retrieval.query-route
version: 1.4.0
aliases:
- oss-query-route
- query-route
licence:
  kind: open
  adapter: Apache-2.0
weights:
  local: {}
base:
  id: jeff-base
  version: v1.4
  max_options: 13
context:
- key: menu
  description: The sources a query can be sent to (document collections, indexes, databases, tools), written as tool definitions
    with names and descriptions.
  required: true
input:
  key: query
  description: The user's query.
  form: fields
functions:
  source:
    interface: route
    type: choice
    instructions: 'Which of the sources on the menu should this query be sent to? Each source (a document collection, index,
      database or tool) is described on the menu. Choose the one source whose contents answer the query; judge by what each
      source holds, not by words the query shares with a source''s name. none: no source on the menu holds what the query
      needs (it belongs to a source that is not listed), or the message needs no lookup at all (a greeting, thanks, or a request
      to reword text). several: answering needs facts from two or more different sources on the menu, because no single source
      holds all of them.'
    labels:
      source: caller
      fixed_first: {}
      caller_keys: null
      max: 13
    abstain_labels: []
    calibration:
      data: hf://datasets/teamsuzie/jeff-data@main/apps/oss-query-route/calibration.jsonl
      data_mirror:
        path: /mnt/d/jeff-data/apps/oss-query-route/calibration.jsonl
        sha256: 14735520c86f8c6c86f6ca390d905813f6c5838ba81a09f21d0f3ae8866496e8
      rows: 2000
      target_precision: 0.95
      threshold: 0.342544
      precision_at_threshold: 0.987
      coverage_at_threshold: 1.0
routes_to: []
tests:
  published: null
  calibration: null
  internal: hf://datasets/teamsuzie/jeff-data@main/apps/oss-query-route/test.jsonl
  internal_calibration: hf://datasets/teamsuzie/jeff-data@main/apps/oss-query-route/calibration.jsonl
  function_by: only
hub:
  title: oss-query-route
  summary: Jeff v1.4 adapter `query-route`. Sends a query to the right source on a menu of document collections, databases
    and tools; or none, or several.
  source: local adapter folder oss-query-route (not on Hugging Face)
  notes:
  - 'source: instructions are the one text of the 1373 test rows marked canonical (source.instructions); the other 627 ask
    the same question reworded or with no instructions (as trained), and are rebuilt with the canonical text in template mode.'
  - 'source: max 9 is the largest number of caller labels in the test rows (nothing documents a training limit).'
  - 'source: the calibration rows offer up to 13 caller labels, more than the test rows'' 9, so max is 13.'
  - 'base: jeff-base v1.4, identified by the SHA-256 of its model.safetensors, which the adapter''s decision_config.json records
    for its base checkpoint.'
  - 'tests: the test set is the private hf://datasets/teamsuzie/jeff-data@main/apps/oss-query-route/test.jsonl, so tests.published
    is null; the calibration of each function is filled in later by `jeff calibrate`.'
