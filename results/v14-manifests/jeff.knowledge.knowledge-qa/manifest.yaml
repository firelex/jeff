hub:
  title: knowledge-qa-v2
  summary: Jeff v1.4 adapter `knowledge-qa`. Answers multiple-choice science, commonsense and general-knowledge questions.
  source: local adapter folder knowledge-qa-v2 (not on Hugging Face)
  notes:
  - 'blank: instructions are the one text of the 116 test rows marked canonical (source.instructions); the other 49 ask the
    same question reworded or with no instructions (as trained), and are rebuilt with the canonical text in template mode.'
  - 'blank: every test row has the keys [''A'', ''B''] in this order, with descriptions that vary, so the labels are ''describe'':
    the caller describes these keys.'
  - 'question: instructions are the one text of the 612 test rows marked canonical (source.instructions); the other 264 ask
    the same question reworded or with no instructions (as trained), and are rebuilt with the canonical text in template mode.'
  - 'question: max 8 is the largest number of caller labels in the test rows (nothing documents a training limit).'
  - 'continuation: instructions are the one text of the 127 test rows marked canonical (source.instructions); the other 53
    ask the same question reworded or with no instructions (as trained), and are rebuilt with the canonical text in template
    mode.'
  - 'continuation: every test row has the keys [''A'', ''B'', ''C'', ''D''] in this order, with descriptions that vary, so
    the labels are ''describe'': the caller describes these keys.'
  - 'passage: instructions are the one text of the 120 test rows marked canonical (source.instructions); the other 30 ask
    the same question reworded or with no instructions (as trained), and are rebuilt with the canonical text in template mode.'
  - 'passage: every test row has the keys [''A'', ''B'', ''C'', ''D''] in this order, with descriptions that vary, so the
    labels are ''describe'': the caller describes these keys.'
  - 'passage_text: instructions are the one text of the 128 test rows marked canonical (source.instructions); the other 67
    ask the same question reworded or with no instructions (as trained), and are rebuilt with the canonical text in template
    mode.'
  - 'passage_text: every test row has the keys [''A'', ''B'', ''C'', ''D''] in this order, with descriptions that vary, so
    the labels are ''describe'': the caller describes these keys.'
  - 'social: instructions are the one text of the 92 test rows marked canonical (source.instructions); the other 43 ask the
    same question reworded or with no instructions (as trained), and are rebuilt with the canonical text in template mode.'
  - 'social: every test row has the keys [''A'', ''B'', ''C''] in this order, with descriptions that vary, so the labels are
    ''describe'': the caller describes these keys.'
  - 'solution: instructions are the one text of the 138 test rows marked canonical (source.instructions); the other 50 ask
    the same question reworded or with no instructions (as trained), and are rebuilt with the canonical text in template mode.'
  - 'solution: every test row has the keys [''A'', ''B''] in this order, with descriptions that vary, so the labels are ''describe'':
    the caller describes these keys.'
  - 'base: jeff-base v1.4, identified by the SHA-256 of its model.safetensors, which the adapter''s decision_config.json records
    for its base checkpoint.'
  - 'tests: the test set is the private hf://datasets/teamsuzie/jeff-data@main/apps/knowledge-qa-v2/test.jsonl, so tests.published
    is null; the calibration of each function is filled in later by `jeff calibrate`.'
