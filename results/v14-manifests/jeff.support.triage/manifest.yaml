id: jeff.support.triage
version: 1.4.0
aliases:
- triage
licence:
  kind: open
  adapter: Apache-2.0
weights:
  local: {}
base:
  id: jeff-base
  version: v1.4
  max_options: 39
context:
- key: company
  description: One sentence about the organisation the message is sent to.
  required: true
- key: channel
  description: Where the message came from, for example email, web form, chat, app review, social media reply or phone transcript.
  required: true
input:
  key: message
  description: The ticket or email as received, including subject line, quoted thread and signature.
  form: fields
functions:
  route:
    interface: route
    type: choice
    instructions: Which team should handle this message? If it covers several issues, choose the team for the most important
      one.
    labels:
      source: caller
      fixed_first:
        other: Not for any of these teams
      caller_keys: k{n}
      max: 35
    abstain_labels: []
    calibration:
      data: hf://datasets/teamsuzie/jeff-data@main/apps/triage/calibration.jsonl
      data_mirror:
        path: /mnt/d/jeff-data/apps/triage/calibration.jsonl
        sha256: 93c047ff96a9a74d8d7def273a0856feb2b6a06e2cb2bbe02f22bdb36f333dd4
      rows: 367
      target_precision: 0.95
      threshold: 0.43479
      precision_at_threshold: 0.950954
      coverage_at_threshold: 1.0
  urgency:
    interface: rate
    type: score
    instructions: How urgently does this need a response?
    labels:
      source: fixed
      levels:
      - No action needed
      - Can wait a few days
      - Handle within a day
      - Handle within hours
      - Handle immediately
    abstain_labels: []
    calibration:
      data: hf://datasets/teamsuzie/jeff-data@main/apps/triage/calibration.jsonl
      data_mirror:
        path: /mnt/d/jeff-data/apps/triage/calibration.jsonl
        sha256: 93c047ff96a9a74d8d7def273a0856feb2b6a06e2cb2bbe02f22bdb36f333dd4
      rows: 367
      target_precision: 0.95
      threshold: 0.787201
      precision_at_threshold: 0.95
      coverage_at_threshold: 0.599455
  sentiment:
    interface: rate
    type: score
    instructions: How does the customer feel?
    labels:
      source: fixed
      levels:
      - Very negative, angry or distressed
      - Negative
      - Neutral
      - Positive
      - Very positive
    abstain_labels: []
    calibration:
      data: hf://datasets/teamsuzie/jeff-data@main/apps/triage/calibration.jsonl
      data_mirror:
        path: /mnt/d/jeff-data/apps/triage/calibration.jsonl
        sha256: 93c047ff96a9a74d8d7def273a0856feb2b6a06e2cb2bbe02f22bdb36f333dd4
      rows: 367
      target_precision: 0.95
      threshold: 0.686658
      precision_at_threshold: 0.950464
      coverage_at_threshold: 0.880109
  needs_human:
    interface: requires_escalation
    type: noul
    instructions: Does this need a person to act on it now, rather than an automatic reply? Answer yes for complaints that
      could escalate, legal or safety issues, or requests an automatic system cannot resolve.
    labels:
      source: fixed
    abstain_labels: []
    calibration:
      data: hf://datasets/teamsuzie/jeff-data@main/apps/triage/calibration.jsonl
      data_mirror:
        path: /mnt/d/jeff-data/apps/triage/calibration.jsonl
        sha256: 93c047ff96a9a74d8d7def273a0856feb2b6a06e2cb2bbe02f22bdb36f333dd4
      rows: 367
      target_precision: 0.95
      threshold: 0.543562
      precision_at_threshold: 0.989101
      coverage_at_threshold: 1.0
routes_to: []
tests:
  published: null
  calibration: null
  internal: hf://datasets/teamsuzie/jeff-data@main/apps/triage/test.jsonl
  internal_calibration: hf://datasets/teamsuzie/jeff-data@main/apps/triage/calibration.jsonl
  function_by: id_suffix
hub:
  title: triage
  summary: Jeff v1.4 adapter `triage`. Routes a support ticket or email to a team and scores its urgency, sentiment and need
    for a person.
  source: local adapter folder triage (not on Hugging Face)
  notes:
  - 'route: instructions are the one text of the 1280 test rows marked canonical (source.instructions); the other 534 ask
    the same question reworded or with no instructions (as trained), and are rebuilt with the canonical text in template mode.'
  - 'route: max 35 is the largest number of caller labels in the test rows (nothing documents a training limit).'
  - 'urgency: instructions are the one text of the 1255 test rows marked canonical (source.instructions); the other 559 ask
    the same question reworded or with no instructions (as trained), and are rebuilt with the canonical text in template mode.'
  - 'sentiment: instructions are the one text of the 1269 test rows marked canonical (source.instructions); the other 545
    ask the same question reworded or with no instructions (as trained), and are rebuilt with the canonical text in template
    mode.'
  - 'needs_human: instructions are the one text of the 1281 test rows marked canonical (source.instructions); the other 533
    ask the same question reworded or with no instructions (as trained), and are rebuilt with the canonical text in template
    mode.'
  - 'base: jeff-base v1.4, identified by the SHA-256 of its model.safetensors, which the adapter''s decision_config.json records
    for its base checkpoint.'
  - 'tests: the test set is the private hf://datasets/teamsuzie/jeff-data@main/apps/triage/test.jsonl, so tests.published
    is null; the calibration of each function is filled in later by `jeff calibrate`.'
