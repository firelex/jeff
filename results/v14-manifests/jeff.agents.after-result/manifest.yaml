id: jeff.agents.after-result
version: 1.4.0
aliases:
- oss-after-result
- after-result
licence:
  kind: open
  adapter: Apache-2.0
weights:
  local: {}
base:
  id: jeff-base
  version: v1.4
  max_options: 5
context:
- key: app
  description: 'The application the agent works in: its name and a description of what it does and for whom.'
  required: true
- key: today
  description: Today's date, written out (for example 'Wednesday 23 June 2027').
  required: true
- key: tools
  description: 'The tools the agent can call, a list of ''name: what it does''.'
  required: true
- key: retry_limit
  description: The app's rule for retrying a failed call, as a sentence (for example 'Retry a failed call at most 3 times').
  required: true
- key: goal
  description: What the user asked the agent to achieve, in the user's words.
  required: true
- key: plan
  description: The agent's plan, a list of numbered steps each marked done, current step or still to do.
  required: true
- key: steps_so_far
  description: The calls the agent has made so far, each with its call (tool and arguments) and its result.
  required: true
- key: latest_call
  description: 'The call just made: tool, arguments and the attempt number.'
  required: true
input:
  key: latest_result
  description: The result of the latest call, as the tool returned it (a success with data, or an error with a status and
    message).
  form: fields
functions:
  next:
    interface: classify
    type: choice
    instructions: 'Given the agent''s goal, its plan and the latest tool result, what should the agent do next? continue:
      the latest call worked and steps of the plan remain, or it returned only part of a list and the goal needs the rest
      (fetch the next part). retry: the call failed for a temporary reason (a timeout, the service unavailable, a rate limit
      with a short wait) and the attempts so far are fewer than the retry limit; make the same call again. change_approach:
      the call cannot succeed as it was made because of the agent''s own mistake (a value in the wrong format or not allowed,
      an id or name that differs from the one in the goal, a search spelled differently from the goal); correct the call or
      use another tool. stop: report back to the user: the goal is now done (the last step of the plan worked, or the result
      itself answers the goal), or it cannot be done (the record in the goal does not exist, or the request was refused for
      a reason no retry or other tool can change). escalate: a person must act: permission denied, login expired, approval
      needed, or a temporary failure has already used every allowed retry.'
    labels:
      source: fixed
      fixed:
        change_approach: 'Change approach: the call cannot work as it was made (a wrong value, a typo, a bad format); fix
          the call or use another tool.'
        continue: 'Continue: the step worked (or returned part of a list with more to fetch); go on to the next step.'
        escalate: 'Escalate: a person has to act: permission denied, login expired, approval needed, or a temporary failure
          has used up every allowed retry.'
        retry: 'Retry: a temporary failure, and attempts so far are below the retry limit; make the same call again.'
        stop: 'Stop: report back to the user: the goal is done, or it cannot be done and nothing the agent can do will change
          that.'
      subset: false
    abstain_labels: []
    calibration:
      data: hf://datasets/teamsuzie/jeff-data@main/apps/oss-after-result/calibration.jsonl
      data_mirror:
        path: /mnt/d/jeff-data/apps/oss-after-result/calibration.jsonl
        sha256: 7a2055ca4f6e9446c506d1edd85f0f435ebfd71ad06ab439a7daff1311d62beb
      rows: 2000
      target_precision: 0.98
      threshold: 0.701944
      precision_at_threshold: 0.9995
      coverage_at_threshold: 1.0
routes_to: []
tests:
  published: null
  calibration: null
  internal: hf://datasets/teamsuzie/jeff-data@main/apps/oss-after-result/test.jsonl
  internal_calibration: hf://datasets/teamsuzie/jeff-data@main/apps/oss-after-result/calibration.jsonl
  function_by: only
hub:
  title: oss-after-result
  summary: 'Jeff v1.4 adapter `after-result`. After each tool result, decides what the agent should do: continue, retry, change
    approach, stop, or hand over to a person.'
  source: local adapter folder oss-after-result (not on Hugging Face)
  notes:
  - 'next: instructions are the one text of the 1399 test rows marked canonical (source.instructions); the other 601 ask the
    same question reworded or with no instructions (as trained), and are rebuilt with the canonical text in template mode.'
  - 'next: every test row has the same 5 labels in varying orders (training shuffled them), so they are listed by key.'
  - 'base: jeff-base v1.4, identified by the SHA-256 of its model.safetensors, which the adapter''s decision_config.json records
    for its base checkpoint.'
  - 'tests: the test set is the private hf://datasets/teamsuzie/jeff-data@main/apps/oss-after-result/test.jsonl, so tests.published
    is null; the calibration of each function is filled in later by `jeff calibrate`.'
